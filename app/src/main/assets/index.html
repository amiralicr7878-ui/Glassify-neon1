            const track = tracks[idx];
            const c1 = track ? track.colors[0] : '#00f0ff';
            nextCard.style.setProperty('--card-c1', c1);
            nextCard.classList.add('is-active');

            if (triggerSpring) animateCardSpring(nextCard, c1);
        }

        function animateHeartButton(btn, isFav) {
            if (!btn) return;
            const svg = btn.querySelector('svg');
            if (svg && typeof svg.animate === 'function') {
                if (svg._heartAnim) svg._heartAnim.cancel();
                if (isFav) {
                    svg._heartAnim = svg.animate(
                        [
                            { transform: 'scale3d(0.5, 0.5, 1) rotate(0deg)', offset: 0 },
                            { transform: 'scale3d(1.55, 1.55, 1) rotate(-14deg)', offset: 0.34 },
                            { transform: 'scale3d(0.84, 0.84, 1) rotate(8deg)', offset: 0.62 },
                            { transform: 'scale3d(1.16, 1.16, 1) rotate(-3deg)', offset: 0.82 },
                            { transform: 'scale3d(1, 1, 1) rotate(0deg)', offset: 1 }
                        ],
                        { duration: 560, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                    );
                } else {
                    svg._heartAnim = svg.animate(
                        [
                            { transform: 'scale3d(1, 1, 1)', offset: 0 },
                            { transform: 'scale3d(0.7, 0.7, 1)', offset: 0.45 },
                            { transform: 'scale3d(1.08, 1.08, 1)', offset: 0.8 },
                            { transform: 'scale3d(1, 1, 1)', offset: 1 }
                        ],
                        { duration: 300, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                    );
                }
            }

            if (!isFav) return;

            const ring = document.createElement('span');
            ring.style.cssText = 'position:absolute;left:50%;top:50%;width:32px;height:32px;margin-left:-16px;margin-top:-16px;border-radius:9999px;border:2px solid #ff2e93;box-shadow:0 0 14px rgba(255,46,147,0.92);pointer-events:none;z-index:30;';
            btn.appendChild(ring);
            const ringAnim = ring.animate(
                [
                    { transform: 'scale3d(0.35, 0.35, 1)', opacity: 1 },
                    { transform: 'scale3d(1.85, 1.85, 1)', opacity: 0 }
                ],
                { duration: 520, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
            );
            ringAnim.onfinish = () => ring.remove();

            const colors = ['#ff2e93', '#00f0ff', '#ff6ec7', '#ffffff', '#ff2e93', '#b537f2'];
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 * i) / 6 - Math.PI / 6;
                const dist = 20 + (i % 2) * 5;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                const dot = document.createElement('span');
                dot.style.cssText = `position:absolute;left:50%;top:50%;width:5px;height:5px;margin-left:-2.5px;margin-top:-2.5px;border-radius:9999px;background:${colors[i]};box-shadow:0 0 8px ${colors[i]};pointer-events:none;z-index:30;`;
                btn.appendChild(dot);
                const dotAnim = dot.animate(
                    [
                        { transform: 'translate3d(0, 0, 0) scale3d(1.1, 1.1, 1)', opacity: 1 },
                        { transform: `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) scale3d(0.2, 0.2, 1)`, opacity: 0 }
                    ],
                    { duration: 480, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
                );
                dotAnim.onfinish = () => dot.remove();
            }
        }

        function updateHeartSvg(svg, isFav, inactiveStroke) {
            if (!svg) return;
            svg.setAttribute('fill', isFav ? '#ff2e93' : 'none');
            svg.setAttribute('stroke', isFav ? '#ff2e93' : inactiveStroke);
        }

        function toggleFavoriteById(id, clickedBtn) {
            const item = tracks.find(t => t.id === id);
            if (!item) return;
            item.favorite = !item.favorite;

            const listBtn = clickedBtn || trackListEl.querySelector(`[data-fav-id="${id}"]`);
            if (listBtn) {
                updateHeartSvg(listBtn.querySelector('svg'), item.favorite, 'rgba(255,255,255,0.55)');
                if (!isFullPlayerOpen || clickedBtn) animateHeartButton(listBtn, item.favorite);
            }

            if (tracks[currentIndex] && tracks[currentIndex].id === id) {
                const fullBtn = document.getElementById('full-fav-btn');
                updateHeartSvg(document.getElementById('full-fav-icon'), item.favorite, 'currentColor');
                if (isFullPlayerOpen) animateHeartButton(fullBtn, item.favorite);
            }

            if (activeTab === 'fav' && !item.favorite && listBtn) {
                const card = listBtn.closest('.track-card');
                if (card) {
                    const anim = card.animate(
                        [
                            { transform: 'scale3d(1, 1, 1)', opacity: 1 },
                            { transform: 'scale3d(0.9, 0.9, 1)', opacity: 0 }
                        ],
                        { duration: 240, easing: 'ease-out', fill: 'forwards' }
                    );
                    anim.onfinish = () => {
                        card.remove();
                        if (!trackListEl.querySelector('.track-card')) renderTrackList();
                    };
                }
            }

            showToast(item.favorite ? 'به علاقه‌مندی‌ها اضافه شد ♥' : 'از علاقه‌مندی‌ها حذف شد');
        }

        function applyNativeTrackList(nativeList, silent = false) {
            if (typeof nativeList === 'string') {
                try { nativeList = JSON.parse(nativeList); } catch (_) { return false; }
            }
            if (!Array.isArray(nativeList) || !nativeList.length) return false;
            tracks.length = 0;
            nativeList.forEach((item, idx) => {
                tracks.push({
                    id: item.id,
                    title: item.title,
                    artist: item.artist,
                    duration: item.duration || 180,
                    favorite: false,
                    colors: [item.c1 || '#00f0ff', item.c2 || '#b537f2'],
                    audioUrl: null,
                    artThumbUrl: item.artThumbUrl || null,
                    artFullUrl: item.artFullUrl || null,
                    isNative: true,
                    nativeIndex: idx
                });
            });
            currentIndex = 0;
            currentTimeSec = 0;
            const countLabel = document.getElementById('song-count-label');
            if (countLabel) countLabel.textContent = `${tracks.length} آهنگ`;
            renderTrackList();
            updateTrackUI();
            if (!silent) showToast(`${tracks.length} آهنگ از حافظه گوشی بارگذاری شد`);
            return true;
        }

        window.onNativeTracksLoaded = function(nativeList) {
            applyNativeTrackList(nativeList, false);
        };

        function pullNativeTracksFromBridge() {
            if (!isNativeAndroid) return;
            try {
                if (typeof window.AndroidBridge.getTracksJson === 'function') {
                    const raw = window.AndroidBridge.getTracksJson();
                    if (raw && raw !== '[]') {
                        const loaded = applyNativeTrackList(raw, false);
                        if (loaded) return;
                    }
                }
                if (typeof window.AndroidBridge.requestRescan === 'function') {
                    window.AndroidBridge.requestRescan();
                }
            } catch (_) {}
        }

        window.onNativeColorsReady = function(colorMap) {
            if (!colorMap || typeof colorMap !== 'object') return;
            tracks.forEach((t, i) => {
                const pair = colorMap[String(t.id)];
                if (pair && pair.length === 2) {
                    t.colors = pair;
                    if (i === currentIndex) {
                        applyTrackColors(pair[0], pair[1]);
                        if (activeCardEl) activeCardEl.style.setProperty('--card-c1', pair[0]);
                    }
                }
            });
        };

        window.onNativeSync = function(nativeIdx, playing, posSec, durSec) {
            if (isSeeking) return;
            const foundIdx = tracks.findIndex(t => t.isNative && t.nativeIndex === nativeIdx);
            if (foundIdx >= 0 && foundIdx !== currentIndex) {
                const dir = foundIdx > currentIndex ? 1 : -1;
                currentIndex = foundIdx;
                updateActiveCardUI(foundIdx, false);
                updateTrackUI();
                animateCoverSlide(dir);
            }
            if (durSec > 0 && tracks[currentIndex]) {
                tracks[currentIndex].duration = Math.floor(durSec);
                seekSlider.max = tracks[currentIndex].duration;
                document.getElementById('total-duration').textContent = formatTime(tracks[currentIndex].duration);
            }
            currentTimeSec = posSec;
            if (isPlaying !== playing) {
                isPlaying = playing;
                updatePlayUI();
            }
            syncProgressUI();
        };

        window.onNativeTrackChanged = function(nativeIdx, durSec) {
            const foundIdx = tracks.findIndex(t => t.isNative && t.nativeIndex === nativeIdx);
            if (foundIdx < 0) return;
            const dir = lastSlideDirection || (foundIdx >= currentIndex ? 1 : -1);
            lastSlideDirection = 0;
            currentIndex = foundIdx;
            currentTimeSec = 0;
            smoothProgress = 0;
            if (durSec > 0 && tracks[foundIdx]) {
                tracks[foundIdx].duration = Math.floor(durSec);
            }
            updateActiveCardUI(foundIdx, false);
            updateTrackUI();
            animateCoverSlide(dir);
        };

        function startProgressLoop() {
            stopProgressLoop();
            if (isNativeAndroid && tracks[currentIndex]?.isNative) return;
            progressTimer = setInterval(() => {
                if (!isPlaying || isSeeking) return;
                const track = tracks[currentIndex];
                if (!track) return;

                if (track.audioUrl) {
                    currentTimeSec = htmlAudio.currentTime || 0;
                    if (isFinite(htmlAudio.duration) && htmlAudio.duration > 0) {
                        track.duration = Math.floor(htmlAudio.duration);
                    }
                } else {
                    currentTimeSec += 0.25;
                    if (currentTimeSec >= track.duration) {
                        if (isRepeat) {
                            currentTimeSec = 0;
                            smoothProgress = 0;
                        } else {
                            nextTrack(true);
                            return;
                        }
                    }
                }
                syncProgressUI();
            }, 250);
        }

        function stopProgressLoop() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        function buildTrackCardHtml(track) {
            const realIdx = tracks.findIndex(t => t.id === track.id);
            const isCurrent = realIdx === currentIndex;
            const [c1, c2] = track.colors;
            const fallbackArt = track.artFullUrl || '';
            const artHtml = track.artThumbUrl
                ? `<img src="${track.artThumbUrl}" data-fallback="${fallbackArt}" decoding="async" alt="" class="absolute inset-0 w-full h-full object-cover z-10" onerror="if(this.dataset.fallback && this.src !== this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback='';}else{this.style.display='none';}">`
                : '';

            return `
                <div data-index="${realIdx}" style="--card-c1: ${c1};"
                    class="track-card liquid-glass rounded-[24px] p-3 flex items-center justify-between gap-3 cursor-pointer ${isCurrent ? 'is-active' : ''}">
                    <div class="flex items-center gap-3 min-w-0 flex-1">
                        <div class="w-12 h-12 rounded-2xl shrink-0 flex items-center justify-center relative overflow-hidden shadow-md"
                            style="background: linear-gradient(135deg, ${c1}, ${c2});">
                            <svg class="w-6 h-6 text-white drop-shadow" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                            </svg>
                            ${artHtml}
                        </div>
                        <div class="min-w-0 text-right">
                            <h4 class="track-card-title text-sm font-bold truncate text-white">${track.title}</h4>
                            <p class="text-[11px] text-white/60 truncate mt-0.5">${track.artist.split('•')[0].trim()}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-[11px] font-medium text-white/50">${formatTime(track.duration)}</span>
                        <button data-fav-id="${track.id}" aria-label="علاقه‌مندی"
                            class="fav-heart-wrap w-9 h-9 rounded-full flex items-center justify-center">
                            <svg class="w-4 h-4" viewBox="0 0 24 24"
                                fill="${track.favorite ? '#ff2e93' : 'none'}"
                                stroke="${track.favorite ? '#ff2e93' : 'rgba(255,255,255,0.55)'}"
                                stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function animateListViewTransition(dir = 0) {
            if (!trackListEl || typeof trackListEl.animate !== 'function') return;
            if (trackListEl._viewAnim) trackListEl._viewAnim.cancel();
            const shift = dir === 0 ? 0 : (dir > 0 ? -16 : 16);
            trackListEl._viewAnim = trackListEl.animate(
                [
                    { opacity: 0.25, transform: `translate3d(${shift}px, 6px, 0) scale3d(0.985, 0.985, 1)` },
                    { opacity: 1, transform: 'translate3d(0, 0, 0) scale3d(1, 1, 1)' }
                ],
                { duration: 340, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
            );
        }

        function renderTrackList(animDir = 0) {
            if (!trackListEl) return;
            const normQuery = normalizeSearchText(searchQuery);

            if (activeTab === 'artists' && !selectedArtist) {
                activeCardEl = null;
                const artistMap = new Map();
                tracks.forEach((t, idx) => {
                    const cleanArtist = (t.artist || 'هنرمند ناشناس').split('•')[0].trim();
                    if (!artistMap.has(cleanArtist)) {
                        artistMap.set(cleanArtist, {
                            name: cleanArtist,
                            songs: [],
                            colors: t.colors,
                            artThumbUrl: t.artThumbUrl,
                            firstIndex: idx
                        });
                    }
                    const entry = artistMap.get(cleanArtist);
                    entry.songs.push(t);
                    if (!entry.artThumbUrl && t.artThumbUrl) entry.artThumbUrl = t.artThumbUrl;
                });

                let artistsArr = Array.from(artistMap.values());
                if (normQuery) {
                    artistsArr = artistsArr.filter(a => normalizeSearchText(a.name).includes(normQuery));
                }

                if (searchCountEl) {
                    if (normQuery) {
                        searchCountEl.textContent = `${artistsArr.length} خواننده`;
                        searchCountEl.classList.remove('hidden');
                    } else {
                        searchCountEl.classList.add('hidden');
                    }
                }

                if (!artistsArr.length) {
                    trackListEl.innerHTML = `
                        <div class="liquid-glass rounded-3xl p-8 text-center text-white/65 text-sm mt-4 space-y-3">
                            <div>خواننده‌ای با عبارت «<span class="text-cyan-300 font-bold">${searchQuery}</span>» پیدا نشد.</div>
                            <button type="button" id="empty-search-reset-btn"
                                class="liquid-glass-btn px-4 py-1.5 rounded-full text-xs font-semibold text-cyan-200">
                                نمایش همه خواننده‌ها
                            </button>
                        </div>
                    `;
                    const resetBtn = document.getElementById('empty-search-reset-btn');
                    if (resetBtn) resetBtn.addEventListener('click', () => setSearchQuery(''));
                    if (animDir !== 0) animateListViewTransition(animDir);
                    return;
                }

                const currentArtistClean = (tracks[currentIndex]?.artist || '').split('•')[0].trim();
                trackListEl.innerHTML = artistsArr.map((art) => {
                    const [c1, c2] = art.colors;
                    const isPlayingArtist = art.name === currentArtistClean;
                    const artImgHtml = art.artThumbUrl
                        ? `<img src="${art.artThumbUrl}" loading="lazy" decoding="async" alt="" class="absolute inset-0 w-full h-full object-cover z-10" onerror="this.style.display='none'">`
                        : '';
                    return `
                        <div data-artist-name="${art.name.replace(/"/g, '&quot;')}" style="--card-c1: ${c1};"
                            class="track-card liquid-glass rounded-[24px] p-3 flex items-center justify-between gap-3 cursor-pointer ${isPlayingArtist ? 'is-active' : ''}">
                            <div class="flex items-center gap-3 min-w-0 flex-1">
                                <div class="w-12 h-12 rounded-full shrink-0 flex items-center justify-center relative overflow-hidden shadow-md border border-white/25"
                                    style="background: linear-gradient(135deg, ${c1}, ${c2});">
                                    <svg class="w-5 h-5 text-white drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                    ${artImgHtml}
                                </div>
                                <div class="min-w-0 text-right">
                                    <h4 class="track-card-title text-sm font-bold truncate text-white">${art.name}</h4>
                                    <p class="text-[11px] text-white/60 truncate mt-0.5">${art.songs.length} آهنگ</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <button type="button" data-play-artist="${art.name.replace(/"/g, '&quot;')}" aria-label="پخش آهنگ‌های خواننده"
                                    class="liquid-glass-btn w-8 h-8 rounded-full flex items-center justify-center text-cyan-200">
                                    <svg class="w-3.5 h-3.5 translate-x-[0.5px]" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </button>
                                <svg class="w-4 h-4 text-white/45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M15 18l-6-6 6-6"/>
                                </svg>
                            </div>
                        </div>
                    `;
                }).join('');

                if (animDir !== 0) animateListViewTransition(animDir);
                return;
            }

            let list = activeTab === 'fav'
                ? tracks.filter(t => t.favorite)
                : (activeTab === 'artists' && selectedArtist
                    ? tracks.filter(t => (t.artist || '').split('•')[0].trim() === selectedArtist)
                    : tracks);

            if (normQuery) {
                list = list.filter(t =>
                    normalizeSearchText(t.title).includes(normQuery) ||
                    normalizeSearchText(t.artist).includes(normQuery)
                );
            }

            if (searchCountEl) {
                if (normQuery) {
                    searchCountEl.textContent = `${list.length} نتیجه`;
                    searchCountEl.classList.remove('hidden');
                } else {
                    searchCountEl.classList.add('hidden');
                }
            }

            const artistHeaderHtml = (activeTab === 'artists' && selectedArtist)
                ? `
                    <div class="liquid-glass rounded-2xl px-3.5 py-2 flex items-center justify-between gap-2">
                        <button type="button" id="back-to-artists-btn"
                            class="liquid-glass-btn px-3 py-1 rounded-full text-[11px] font-bold text-cyan-200 flex items-center gap-1">
                            <span>→</span>
                            <span>همه خواننده‌ها</span>
                        </button>
                        <span class="text-xs font-extrabold text-white truncate">${selectedArtist} (${list.length})</span>
                    </div>
                `
                : '';

            if (!list.length) {
                activeCardEl = null;
                if (normQuery) {
                    trackListEl.innerHTML = artistHeaderHtml + `
                        <div class="liquid-glass rounded-3xl p-8 text-center text-white/65 text-sm mt-4 space-y-3">
                            <div>آهنگی با عبارت «<span class="text-cyan-300 font-bold">${searchQuery}</span>» پیدا نشد.</div>
                            <button type="button" id="empty-search-reset-btn"
                                class="liquid-glass-btn px-4 py-1.5 rounded-full text-xs font-semibold text-cyan-200">
                                نمایش همه آهنگ‌ها
                            </button>
                        </div>
                    `;
                    const resetBtn = document.getElementById('empty-search-reset-btn');
                    if (resetBtn) resetBtn.addEventListener('click', () => setSearchQuery(''));
                } else {
                    trackListEl.innerHTML = artistHeaderHtml + `
                        <div class="liquid-glass rounded-3xl p-8 text-center text-white/60 text-sm mt-4">
                            هنوز آهنگی در علاقه‌مندی‌ها نیست.<br>
                            <span class="text-xs text-cyan-300/80 mt-1 inline-block">روی قلب کنار هر آهنگ بزن تا اینجا اضافه شود.</span>
                        </div>
                    `;
                }
                const backBtn = document.getElementById('back-to-artists-btn');
                if (backBtn) {
                    backBtn.addEventListener('click', () => {
                        selectedArtist = null;
                        renderTrackList(-1);
                    });
                }
                if (animDir !== 0) animateListViewTransition(animDir);
                return;
            }

            trackListEl.innerHTML = artistHeaderHtml + list.map(buildTrackCardHtml).join('');
            const backBtn = document.getElementById('back-to-artists-btn');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    selectedArtist = null;
                    renderTrackList(-1);
                });
            }
            activeCardEl = trackListEl.querySelector(`.track-card[data-index="${currentIndex}"]`);
            if (animDir !== 0) animateListViewTransition(animDir);
        }

        function releasePressedCard() {
            if (!pressedCardEl) return;
            const c = pressedCardEl;
            pressedCardEl = null;
            c.style.transition = 'transform 220ms cubic-bezier(0.22, 1, 0.36, 1)';
            c.style.transform = 'scale3d(1, 1, 1)';
            setTimeout(() => {
                if (pressedCardEl !== c) {
                    c.style.transition = '';
                    c.style.transform = '';
                }
            }, 230);
        }

        trackListEl.addEventListener('pointerdown', (e) => {
            if (e.target.closest('[data-fav-id]') || e.target.closest('[data-play-artist]')) return;
            const card = e.target.closest('.track-card');
            if (!card) return;
            pressedCardEl = card;
            if (card._springAnim) card._springAnim.cancel();
            card.style.transition = 'transform 110ms cubic-bezier(0.2, 0, 0, 1)';
            card.style.transform = 'scale3d(0.935, 0.935, 1)';
        }, { passive: true });

        trackListEl.addEventListener('pointercancel', releasePressedCard, { passive: true });
        trackListEl.addEventListener('pointerleave', releasePressedCard, { passive: true });

        trackListEl.addEventListener('click', (e) => {
            const playArtistBtn = e.target.closest('[data-play-artist]');
            if (playArtistBtn) {
                e.stopPropagation();
                releasePressedCard();
                const artistName = playArtistBtn.getAttribute('data-play-artist');
                const firstSongIdx = tracks.findIndex(t => (t.artist || '').split('•')[0].trim() === artistName);
                if (firstSongIdx >= 0) {
                    selectTrack(firstSongIdx, true, false);
                    showToast(`پخش آثار ${artistName}`);
                }
                return;
            }

            const favBtn = e.target.closest('[data-fav-id]');
            if (favBtn) {
                e.stopPropagation();
                releasePressedCard();
                const id = Number(favBtn.getAttribute('data-fav-id'));
                toggleFavoriteById(id, favBtn);
                return;
            }

            const card = e.target.closest('.track-card');
            if (card) {
                pressedCardEl = null;
                const artistName = card.getAttribute('data-artist-name');
                if (artistName) {
                    selectedArtist = artistName;
                    renderTrackList(1);
                    return;
                }
                const idx = parseInt(card.getAttribute('data-index'), 10);
                if (!isNaN(idx) && tracks[idx]) {
                    selectTrack(idx, true, true);
                }
            }
        });

        function updateTrackUI() {
            const track = tracks[currentIndex];
            if (!track) return;
            const [c1, c2] = track.colors;
            applyTrackColors(c1, c2);

            document.getElementById('mini-title').textContent = track.title;
            document.getElementById('mini-artist').textContent = track.artist.split('•')[0].trim();
            document.getElementById('full-title').textContent = track.title;
            document.getElementById('full-artist').textContent = track.artist;

            applyCoverArt(
                document.getElementById('mini-cover-img'),
                document.getElementById('mini-cover-icon'),
                track.artThumbUrl
            );
            applyCoverArt(
                document.getElementById('full-cover-img'),
                document.getElementById('full-cover-icon'),
                track.artFullUrl || track.artThumbUrl
            );

            seekSlider.max = track.duration;
            document.getElementById('total-duration').textContent = formatTime(track.duration);

            updateHeartSvg(document.getElementById('full-fav-icon'), track.favorite, 'currentColor');
            syncProgressUI();
        }

        function syncProgressUI() {
            const track = tracks[currentIndex];
            if (!track) return;
            const ratio = Math.min(1, Math.max(0, currentTimeSec / (track.duration || 1)));
            seekSlider.value = currentTimeSec;
            document.getElementById('mini-progress').style.transform = `scaleX(${ratio})`;
            document.getElementById('current-time').textContent = formatTime(currentTimeSec);
            if (!isFullPlayerOpen) smoothProgress = ratio;
        }

        function updatePlayUI() {
            const miniBtn = document.getElementById('mini-play-btn');
            const fullBtn = document.getElementById('full-play-btn');
            const miniPlayerEl = document.getElementById('mini-player');
            const miniCoverEl = document.getElementById('mini-cover');
            const coverEq = document.getElementById('cover-eq');
            const artFrame = document.getElementById('album-art-frame');

            if (isPlaying) {
                miniBtn.classList.add('is-playing-btn');
                fullBtn.classList.add('is-playing-btn');
                if (miniPlayerEl) miniPlayerEl.classList.add('is-playing');
                if (miniCoverEl) miniCoverEl.classList.add('is-playing');
                coverEq.classList.add('eq-active');
                artFrame.classList.add('is-playing');
            } else {
                miniBtn.classList.remove('is-playing-btn');
                fullBtn.classList.remove('is-playing-btn');
                if (miniPlayerEl) miniPlayerEl.classList.remove('is-playing');
                if (miniCoverEl) miniCoverEl.classList.remove('is-playing');
                coverEq.classList.remove('eq-active');
                artFrame.classList.remove('is-playing');
            }
        }

        function selectTrack(index, autoPlay = true, triggerSpring = false, slideDir = 0) {
            currentIndex = (index + tracks.length) % tracks.length;
            currentTimeSec = 0;
            smoothProgress = 0;
            const track = tracks[currentIndex];

            htmlAudio.pause();
            stopAmbientSynth();

            updateActiveCardUI(currentIndex, triggerSpring);
            updateTrackUI();
            if (slideDir !== 0) animateCoverSlide(slideDir);

            if (isNativeAndroid && track.isNative && track.nativeIndex >= 0) {
                isPlaying = true;
                updatePlayUI();
                window.AndroidBridge.selectAndPlay(track.nativeIndex);
                return;
            }

            if (track.audioUrl) {
                htmlAudio.src = track.audioUrl;
                htmlAudio.currentTime = 0;
            } else {
                htmlAudio.removeAttribute('src');
            }

            if (isFullPlayerOpen) drawWaveProgress();

            if (autoPlay) playCurrent();
            else {
                isPlaying = false;
                updatePlayUI();
            }
        }

        function playCurrent() {
            const track = tracks[currentIndex];
            if (!track) return;
            if (isNativeAndroid && track.isNative) {
                window.AndroidBridge.togglePlay();
                return;
            }
            isPlaying = true;
            updatePlayUI();
            if (track.audioUrl) htmlAudio.play().catch(() => {});
            else startAmbientSynth(track);
            startProgressLoop();
        }

        function pauseCurrent() {
            if (isNativeAndroid && tracks[currentIndex]?.isNative) {
                window.AndroidBridge.togglePlay();
                return;
            }
            isPlaying = false;
            updatePlayUI();
            htmlAudio.pause();
            stopAmbientSynth();
            stopProgressLoop();
        }

        function togglePlay() {
            triggerPlayFeedback();
            if (isNativeAndroid && tracks[currentIndex]?.isNative) {
                window.AndroidBridge.togglePlay();
                return;
            }
            if (isPlaying) pauseCurrent();
            else playCurrent();
        }

        function nextTrack(fromAutoEnd = false) {
            if (!fromAutoEnd) triggerNextFeedback();
            if (isNativeAndroid && tracks[currentIndex]?.isNative) {
                window.AndroidBridge.next();
                return;
            }
            if (isShuffle && tracks.length > 1) {
                let nextIdx = currentIndex;
                while (nextIdx === currentIndex) nextIdx = Math.floor(Math.random() * tracks.length);
                selectTrack(nextIdx, isPlaying || fromAutoEnd, false, 1);
            } else {
                selectTrack(currentIndex + 1, isPlaying || fromAutoEnd, false, 1);
            }
        }

        function prevTrack() {
            triggerPrevFeedback();
            if (isNativeAndroid && tracks[currentIndex]?.isNative) {
                window.AndroidBridge.previous();
                return;
            }
            if (currentTimeSec > 3) {
                currentTimeSec = 0;
                smoothProgress = 0;
                if (tracks[currentIndex]?.audioUrl) htmlAudio.currentTime = 0;
                syncProgressUI();
                if (isFullPlayerOpen) drawWaveProgress();
            } else {
                selectTrack(currentIndex - 1, isPlaying, false, -1);
            }
        }

        function openFullPlayer() {
            isFullPlayerOpen = true;
            fullPlayer.style.transition = '';
            fullPlayer.style.transform = '';
            fullPlayer.style.opacity = '';
            homeLayer.style.transition = '';
            homeLayer.style.transform = '';
            homeLayer.style.opacity = '';
            homeBgLayer.classList.add('is-receded');

            const track = tracks[currentIndex] || tracks[0];
            smoothProgress = Math.min(1, Math.max(0, currentTimeSec / ((track && track.duration) || 1)));
            resizeWaveCanvas();

            requestAnimationFrame(() => {
                homeLayer.classList.add('is-receded');
                miniPlayerWrap.classList.add('is-hidden');
                fullPlayer.classList.add('is-open');
                lastWaveTimestamp = 0;
                if (!waveAnimId) waveAnimId = requestAnimationFrame(waveTick);
            });
        }

        function closeFullPlayer() {
            isFullPlayerOpen = false;
            if (waveAnimId) {
                cancelAnimationFrame(waveAnimId);
                waveAnimId = null;
            }
            fullPlayer.style.transition = '';
            fullPlayer.style.transform = '';
            fullPlayer.style.opacity = '';
            homeLayer.style.transition = '';
            homeLayer.style.transform = '';
            homeLayer.style.opacity = '';
            homeBgLayer.classList.remove('is-receded');

            fullPlayer.classList.remove('is-open');
            homeLayer.classList.remove('is-receded');
            miniPlayerWrap.classList.remove('is-hidden');
        }

        let sheetStartY = 0;
        let sheetDeltaY = 0;
        let isDraggingSheet = false;

        fullPlayer.addEventListener('touchstart', (e) => {
            if (e.target.closest('#seek-slider') || e.target.closest('button')) return;
            sheetStartY = e.touches[0].clientY;
            sheetDeltaY = 0;
            isDraggingSheet = true;
            fullPlayer.style.transition = 'none';
            homeLayer.style.transition = 'none';
        }, { passive: true });

        fullPlayer.addEventListener('touchmove', (e) => {
            if (!isDraggingSheet) return;
            sheetDeltaY = Math.max(0, e.touches[0].clientY - sheetStartY);
            if (sheetDeltaY > 0) {
                const progress = Math.min(1, sheetDeltaY / 380);
                fullPlayer.style.transform = `translate3d(0, ${sheetDeltaY}px, 0)`;
                fullPlayer.style.opacity = `${1 - progress * 0.25}`;
                homeLayer.style.transform = `scale3d(${0.94 + progress * 0.06}, ${0.94 + progress * 0.06}, 1) translate3d(0, ${8 * (1 - progress)}px, 0)`;
                homeLayer.style.opacity = `${0.42 + progress * 0.58}`;
            }
        }, { passive: true });

        fullPlayer.addEventListener('touchend', () => {
            if (!isDraggingSheet) return;
            isDraggingSheet = false;
            if (sheetDeltaY > 115) closeFullPlayer();
            else {
                fullPlayer.style.transition = '';
                fullPlayer.style.transform = '';
                fullPlayer.style.opacity = '';
                homeLayer.style.transition = '';
                homeLayer.style.transform = '';
                homeLayer.style.opacity = '';
            }
        });

        function resizeWaveCanvas() {
            if (!waveCanvas || !waveCtx) return;
            const rect = waveCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            cachedWaveWidth = rect.width;
            cachedWaveHeight = rect.height;
            waveCanvas.width = Math.round(rect.width * dpr);
            waveCanvas.height = Math.round(rect.height * dpr);
            waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawWaveProgress();
        }

        function drawWaveProgress() {
            if (!cachedWaveWidth || !cachedWaveHeight || !waveCtx) return;
            const w = cachedWaveWidth;
            const h = cachedWaveHeight;
            const cy = h * 0.5;
            const track = tracks[currentIndex] || tracks[0];
            const [c1, c2] = (track && track.colors) || ['#00f0ff', '#b537f2'];
            const rawProgress = Math.min(1, Math.max(0, currentTimeSec / ((track && track.duration) || 1)));
            const progress = isFullPlayerOpen ? smoothProgress : rawProgress;

            const pad = 12;
            const usableW = Math.max(1, w - pad * 2);
            const activeEnd = pad + usableW * progress;

            waveCtx.clearRect(0, 0, w, h);

            waveCtx.beginPath();
            waveCtx.moveTo(pad, cy);
            waveCtx.lineTo(w - pad, cy);
            waveCtx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
            waveCtx.lineWidth = 4;
            waveCtx.lineCap = 'round';
            waveCtx.stroke();

            const activeLen = activeEnd - pad;
            const grad = waveCtx.createLinearGradient(pad, 0, Math.max(pad + 1, activeEnd), 0);
            grad.addColorStop(0, c1);
            grad.addColorStop(1, c2);

            if (activeLen > 1) {
                waveCtx.save();
                waveCtx.beginPath();
                waveCtx.moveTo(pad, cy);
                waveCtx.lineTo(activeEnd, cy);
                waveCtx.strokeStyle = grad;
                waveCtx.globalAlpha = 0.25 + waveEnergy * 0.15;
                waveCtx.lineWidth = 10 + waveEnergy * 3;
                waveCtx.lineCap = 'round';
                waveCtx.stroke();
                waveCtx.restore();

                if (activeLen > 14) {
                    const maxAmp = Math.min(12, activeLen * 0.14) * waveEnergy;
                    const step = 3;

                    waveCtx.beginPath();
                    waveCtx.moveTo(pad, cy);
                    for (let x = pad; x <= activeEnd; x += step) {
                        const t = (x - pad) / activeLen;
                        const env = Math.pow(Math.sin(t * Math.PI), 1.35);
                        const yOffset = (
                            Math.sin(x * 0.055 - wavePhase * 1.1) * 0.65 +
                            Math.sin(x * 0.092 + wavePhase * 0.8) * 0.35
                        ) * maxAmp * env;
                        waveCtx.lineTo(x, cy - Math.abs(yOffset) * 1.05);
                    }
                    waveCtx.lineTo(activeEnd, cy);
                    waveCtx.closePath();

                    const fillGrad = waveCtx.createLinearGradient(0, cy - maxAmp - 2, 0, cy + 2);
                    fillGrad.addColorStop(0, c1);
                    fillGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    waveCtx.save();
                    waveCtx.globalAlpha = 0.22 * waveEnergy;
                    waveCtx.fillStyle = fillGrad;
                    waveCtx.fill();
                    waveCtx.restore();

                    const strands = [
                        { freq1: 0.052, freq2: 0.088, speed1: 1.2, speed2: -0.7, ampMul: 1.0, width: 1.8, alpha: 0.88, color: grad },
                        { freq1: 0.068, freq2: 0.041, speed1: -0.9, speed2: 1.3, ampMul: 0.78, width: 1.35, alpha: 0.58, color: '#ffffff' },
                        { freq1: 0.044, freq2: 0.105, speed1: 1.5, speed2: 0.55, ampMul: 0.62, width: 1.2, alpha: 0.48, color: grad }
                    ];

                    strands.forEach((s) => {
                        waveCtx.beginPath();
                        for (let x = pad; x <= activeEnd; x += step) {
                            const t = (x - pad) / activeLen;
                            const env = Math.pow(Math.sin(t * Math.PI), 1.4);
                            const y = cy + (
                                Math.sin(x * s.freq1 - wavePhase * s.speed1) * 0.68 +
                                Math.cos(x * s.freq2 + wavePhase * s.speed2) * 0.32
                            ) * maxAmp * s.ampMul * env;
                            if (x === pad) waveCtx.moveTo(x, y);
                            else waveCtx.lineTo(x, y);
                        }
                        waveCtx.save();
                        waveCtx.strokeStyle = s.color;
                        waveCtx.globalAlpha = s.alpha * Math.min(1, waveEnergy + 0.22);
                        waveCtx.lineWidth = s.width;
                        waveCtx.lineCap = 'round';
                        waveCtx.stroke();
                        waveCtx.restore();
                    });

                    if (waveEnergy > 0.25 && activeLen > 36) {
                        const sparkCount = 6;
                        for (let i = 0; i < sparkCount; i++) {
                            const life = (wavePhase * 0.26 + i / sparkCount) % 1;
                            const sx = pad + activeLen * (0.1 + 0.8 * ((i * 0.37 + wavePhase * 0.035) % 1));
                            const dir = i % 2 === 0 ? -1 : 1;
                            const sy = cy + dir * (3 + life * (maxAmp * 1.15));
                            const alpha = Math.sin(life * Math.PI) * 0.72 * waveEnergy;
                            const radius = 1.1 + Math.sin(life * Math.PI) * 1.05;

                            waveCtx.save();
                            waveCtx.beginPath();
                            waveCtx.arc(sx, sy, radius, 0, Math.PI * 2);
                            waveCtx.fillStyle = i % 2 === 0 ? '#ffffff' : c1;
                            waveCtx.globalAlpha = alpha;
                            waveCtx.fill();
                            waveCtx.restore();
                        }
                    }
                }

                waveCtx.beginPath();
                waveCtx.moveTo(pad, cy);
                waveCtx.lineTo(activeEnd, cy);
                waveCtx.strokeStyle = grad;
                waveCtx.lineWidth = 4;
                waveCtx.lineCap = 'round';
                waveCtx.stroke();

                if (activeLen > 24 && waveEnergy > 0.2) {
                    const pulsePos = pad + ((wavePhase * 0.3) % 1) * activeLen;
                    const pulseW = Math.min(48, activeLen * 0.45);
                    const pulseGrad = waveCtx.createLinearGradient(pulsePos - pulseW, cy, pulsePos + pulseW * 0.3, cy);
                    pulseGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                    pulseGrad.addColorStop(0.75, 'rgba(255, 255, 255, 0.85)');
                    pulseGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    waveCtx.save();
                    waveCtx.beginPath();
                    waveCtx.moveTo(Math.max(pad, pulsePos - pulseW), cy);
                    waveCtx.lineTo(Math.min(activeEnd, pulsePos + pulseW * 0.3), cy);
                    waveCtx.strokeStyle = pulseGrad;
                    waveCtx.globalAlpha = 0.8 * waveEnergy;
                    waveCtx.lineWidth = 2.5;
                    waveCtx.lineCap = 'round';
                    waveCtx.stroke();
                    waveCtx.restore();
                }
            }

            const auraRadius = isSeeking ? 18 : (12 + Math.sin(wavePhase * 2.1) * 2.2 * waveEnergy);
            const auraGrad = waveCtx.createRadialGradient(activeEnd, cy, 3, activeEnd, cy, auraRadius);
            auraGrad.addColorStop(0, c2);
            auraGrad.addColorStop(0.55, c1);
            auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            waveCtx.save();
            waveCtx.globalAlpha = isSeeking ? 0.72 : (0.38 + waveEnergy * 0.2);
            waveCtx.fillStyle = auraGrad;
            waveCtx.beginPath();
            waveCtx.arc(activeEnd, cy, auraRadius, 0, Math.PI * 2);
            waveCtx.fill();
            waveCtx.restore();

            const thumbR = isSeeking ? 9.5 : 8;
            const thumbGrad = waveCtx.createLinearGradient(activeEnd - thumbR, cy - thumbR, activeEnd + thumbR, cy + thumbR);
            thumbGrad.addColorStop(0, c1);
            thumbGrad.addColorStop(1, c2);

            waveCtx.save();
            waveCtx.beginPath();
            waveCtx.arc(activeEnd, cy, thumbR, 0, Math.PI * 2);
            waveCtx.fillStyle = thumbGrad;
            waveCtx.fill();
            waveCtx.lineWidth = 2.6;
            waveCtx.strokeStyle = '#ffffff';
            waveCtx.stroke();
            waveCtx.restore();
        }

        function waveTick(timestamp) {
            if (!isFullPlayerOpen) {
                waveAnimId = null;
                return;
            }
            const dt = lastWaveTimestamp ? Math.min(0.05, (timestamp - lastWaveTimestamp) / 1000) : 0.016;
            lastWaveTimestamp = timestamp;

            const targetEnergy = isSeeking ? 1.2 : (isPlaying ? 1.0 : 0.15);
            waveEnergy += (targetEnergy - waveEnergy) * Math.min(1, dt * 6);
            wavePhase += dt * (isPlaying ? 2.1 : 0.42);

            const track = tracks[currentIndex] || tracks[0];
            const targetProgress = Math.min(1, Math.max(0, currentTimeSec / ((track && track.duration) || 1)));
            if (isSeeking || Math.abs(targetProgress - smoothProgress) > 0.15) {
                smoothProgress = targetProgress;
            } else {
                smoothProgress += (targetProgress - smoothProgress) * Math.min(1, dt * 14);
            }

            drawWaveProgress();
            waveAnimId = requestAnimationFrame(waveTick);
        }

        document.getElementById('mini-open-trigger').addEventListener('click', openFullPlayer);
        document.getElementById('close-player-btn').addEventListener('click', closeFullPlayer);
        document.getElementById('mini-play-btn').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
        document.getElementById('mini-prev-btn').addEventListener('click', (e) => { e.stopPropagation(); prevTrack(); });
        document.getElementById('mini-next-btn').addEventListener('click', (e) => { e.stopPropagation(); nextTrack(false); });
        document.getElementById('full-play-btn').addEventListener('click', togglePlay);
        document.getElementById('full-prev-btn').addEventListener('click', prevTrack);
        document.getElementById('full-next-btn').addEventListener('click', () => nextTrack(false));

        document.getElementById('full-fav-btn').addEventListener('click', () => {
            const track = tracks[currentIndex];
            if (!track) return;
            toggleFavoriteById(track.id, null);
        });

        document.getElementById('shuffle-btn').addEventListener('click', (e) => {
            isShuffle = !isShuffle;
            e.currentTarget.classList.toggle('text-cyan-300', isShuffle);
            e.currentTarget.classList.toggle('text-white/55', !isShuffle);
            if (isNativeAndroid) window.AndroidBridge.setShuffle(isShuffle);
            showToast(isShuffle ? 'پخش تصادفی روشن شد' : 'پخش تصادفی خاموش شد');
        });

        document.getElementById('repeat-btn').addEventListener('click', (e) => {
            isRepeat = !isRepeat;
            e.currentTarget.classList.toggle('text-pink-400', isRepeat);
            e.currentTarget.classList.toggle('text-white/55', !isRepeat);
            if (isNativeAndroid) window.AndroidBridge.setRepeat(isRepeat);
            showToast(isRepeat ? 'تکرار آهنگ روشن شد' : 'تکرار آهنگ خاموش شد');
        });

        const startSeek = () => { isSeeking = true; };
        const endSeek = () => { isSeeking = false; };
        seekSlider.addEventListener('pointerdown', startSeek);
        seekSlider.addEventListener('pointerup', endSeek);
        seekSlider.addEventListener('pointercancel', endSeek);
        seekSlider.addEventListener('touchstart', startSeek, { passive: true });
        seekSlider.addEventListener('touchend', endSeek);
        seekSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            const track = tracks[currentIndex];
            currentTimeSec = val;
            if (isNativeAndroid && track?.isNative) {
                window.AndroidBridge.seekToSec(val);
            } else if (track && track.audioUrl) {
                htmlAudio.currentTime = val;
            }
            const ratio = Math.min(1, Math.max(0, currentTimeSec / ((track && track.duration) || 1)));
            smoothProgress = ratio;
            document.getElementById('mini-progress').style.transform = `scaleX(${ratio})`;
            document.getElementById('current-time').textContent = formatTime(currentTimeSec);
            drawWaveProgress();
        });

        const tabOrder = ['all', 'fav', 'artists'];

        function setTab(tab) {
            const prevIdx = tabOrder.indexOf(activeTab);
            const nextIdx = tabOrder.indexOf(tab);
            const dir = prevIdx === -1 || nextIdx === -1 ? 0 : nextIdx - prevIdx;

            activeTab = tab;
            if (tab !== 'artists') selectedArtist = null;

            if (tabGliderEl && nextIdx >= 0) {
                tabGliderEl.style.transform = `translate3d(${-nextIdx * 100}%, 0, 0)`;
            }
            if (tabAllBtn) tabAllBtn.classList.toggle('is-active', tab === 'all');
            if (tabFavBtn) tabFavBtn.classList.toggle('is-active', tab === 'fav');
            if (tabArtistsBtn) tabArtistsBtn.classList.toggle('is-active', tab === 'artists');

            renderTrackList(dir);
        }

        if (tabAllBtn) tabAllBtn.addEventListener('click', () => setTab('all'));
        if (tabFavBtn) tabFavBtn.addEventListener('click', () => setTab('fav'));
        if (tabArtistsBtn) tabArtistsBtn.addEventListener('click', () => setTab('artists'));

        if (searchInputEl) {
            searchInputEl.addEventListener('input', (e) => setSearchQuery(e.target.value));
            searchInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && searchQuery) {
                    e.stopPropagation();
                    setSearchQuery('');
                }
            });
        }
        if (searchClearBtn) {
            searchClearBtn.addEventListener('click', () => {
                setSearchQuery('');
                if (searchInputEl) searchInputEl.focus();
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInputEl && !isFullPlayerOpen && !isSettingsOpen) {
                e.preventDefault();
                if (searchInputEl) searchInputEl.focus();
            } else if (e.key === 'Escape' && isSettingsOpen) {
                closeSettingsSheet();
            }
        });

        const themeCycleBtn = document.getElementById('theme-cycle-btn');
        if (themeCycleBtn) {
            themeCycleBtn.addEventListener('click', () => {
                spinHeaderIcon(themeCycleBtn, 180);
                themeIndex = (themeIndex + 1) % neonThemes.length;
                const t = neonThemes[themeIndex];
                document.documentElement.style.setProperty('--neon-1', t.n1);
                document.documentElement.style.setProperty('--neon-2', t.n2);
                document.documentElement.style.setProperty('--neon-3', t.n3);
                if (tabGliderEl) {
                    tabGliderEl.style.background = `linear-gradient(135deg, ${t.n1}, ${t.n2})`;
                }
                showToast(`طیف نئون: ${t.name}`, themeCycleBtn);
            });
        }

        const audioFileInput = document.getElementById('audio-file-input');
        if (audioFileInput) {
            audioFileInput.addEventListener('click', () => { audioFileInput.value = ''; });
            audioFileInput.addEventListener('change', async (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                const palette = [['#00f0ff', '#b537f2'], ['#ff2e93', '#ff8a00'], ['#00ff9d', '#00c3ff'], ['#ffe600', '#ff006e']];
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const url = URL.createObjectURL(file);
                    const cleanName = file.name.replace(/\.[^/.]+$/, '');
                    const extractedArtUrl = await extractLocalAudioArtwork(file);
                    tracks.unshift({
                        id: Date.now() + i,
                        title: cleanName,
                        artist: 'فایل محلی • Local Audio',
                        duration: 180,
                        favorite: false,
                        colors: palette[(tracks.length + i) % palette.length],
                        audioUrl: url,
                        artThumbUrl: extractedArtUrl,
                        artFullUrl: extractedArtUrl,
                        isNative: false,
                        nativeIndex: -1
                    });
                }
                if (searchQuery) setSearchQuery('');
                else renderTrackList();
                selectTrack(0, true, true);
                showToast(`${files.length} آهنگ واقعی اضافه شد`);
            });
        }

        function initApp() {
            try { initNeonStatusBar(); } catch (_) {}
            try { initGlassAppearance(); } catch (_) {}
            try { initHomeWallpaper(); } catch (_) {}
            try { initWeatherEngine(); } catch (_) {}
            renderTrackList();
            updateTrackUI();
            updatePlayUI();
            resizeWaveCanvas();
            pullNativeTracksFromBridge();
            setTimeout(pullNativeTracksFromBridge, 900);
            setTimeout(pullNativeTracksFromBridge, 2400);
        }

        window.addEventListener('resize', () => {
            resizeWaveCanvas();
            resizeWeatherCanvas();
        });
        if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', initApp);
        else initApp();
    </script>
</body>
</html>
