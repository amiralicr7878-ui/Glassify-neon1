<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Liquid Glass Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-1: #00f0ff;
            --neon-2: #b537f2;
            --neon-3: #ff2e93;
            --track-color-1: #00f0ff;
            --track-color-2: #b537f2;
            --ios-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --ios-spring: cubic-bezier(0.32, 0.72, 0, 1);
            --glass-bg-start: rgba(32, 40, 68, 0.78);
            --glass-bg-end: rgba(16, 21, 38, 0.86);
            --glass-btn-start: rgba(44, 54, 88, 0.82);
            --glass-btn-end: rgba(22, 28, 50, 0.88);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-highlight: rgba(255, 255, 255, 0.24);
            --glass-blur: 14px;
            --glass-saturate: 135%;
            --glass-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
            --settings-surface-start: rgba(28, 36, 62, 0.90);
            --settings-surface-end: rgba(14, 19, 34, 0.94);
            --settings-surface-border: rgba(255, 255, 255, 0.16);
            --settings-surface-highlight: rgba(255, 255, 255, 0.20);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070a14;
            color: #ffffff;
            font-family: 'Vazirmatn', 'Inter', system-ui, -apple-system, sans-serif;
        }

        .app-shell {
            position: relative;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            overflow: hidden;
            background: #070a14;
        }

        .home-bg-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transform: scale3d(1.03, 1.03, 1);
            transition: opacity 0.55s var(--ios-ease), transform 0.55s var(--ios-ease), filter 0.55s var(--ios-ease);
            will-change: opacity, transform;
        }

        .home-bg-layer.has-image { opacity: 1; }
        .home-bg-layer.is-receded {
            transform: scale3d(0.98, 0.98, 1);
            filter: brightness(0.65);
        }

        .home-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .home-bg-scrim {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 15%, rgba(7, 10, 20, 0.34) 0%, rgba(7, 10, 20, 0.72) 100%),
                linear-gradient(180deg, rgba(7, 10, 20, 0.58) 0%, rgba(7, 10, 20, 0.32) 45%, rgba(7, 10, 20, 0.78) 100%);
        }

        .ambient-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.45s ease;
        }

        .ambient-bg.has-wallpaper { opacity: 0.48; }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            will-change: transform;
            opacity: 0.42;
            transform: translate3d(0, 0, 0);
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            top: -80px;
            right: -60px;
            background: radial-gradient(circle, var(--neon-1) 0%, transparent 68%);
            animation: floatOrb1 14s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 360px;
            height: 360px;
            bottom: -90px;
            left: -80px;
            background: radial-gradient(circle, var(--neon-2) 0%, transparent 68%);
            animation: floatOrb2 16s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-20px, 28px, 0) scale(1.08); }
        }
        @keyframes floatOrb2 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(24px, -22px, 0) scale(1.06); }
        }

        .weather-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 35;
            opacity: 0;
            transition: opacity 0.65s var(--ios-ease);
        }
        .weather-canvas.is-active { opacity: 1; }

        .liquid-glass {
            background: linear-gradient(145deg, var(--glass-bg-start) 0%, var(--glass-bg-end) 100%);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                var(--glass-shadow);
            transition:
                background 0.35s var(--ios-ease),
                border-color 0.35s var(--ios-ease),
                box-shadow 0.35s var(--ios-ease);
        }

        .liquid-glass-btn {
            background: linear-gradient(145deg, var(--glass-btn-start) 0%, var(--glass-btn-end) 100%);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 6px 16px rgba(0, 0, 0, 0.32);
            transition:
                transform 0.2s var(--ios-spring),
                background 0.35s var(--ios-ease),
                border-color 0.35s var(--ios-ease),
                box-shadow 0.35s var(--ios-ease);
        }

        .liquid-glass-btn:active { transform: scale3d(0.88, 0.88, 1); }

        .header-spin-btn {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        .header-spin-btn:hover,
        .header-spin-btn:focus,
        .header-spin-btn:focus-visible,
        .header-spin-btn:active {
            outline: none !important;
            border-color: var(--glass-border) !important;
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 6px 16px rgba(0, 0, 0, 0.32) !important;
        }
        .header-spin-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform;
        }

        .neon-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
            padding: calc(env(safe-area-inset-top, 0px) + var(--native-top-offset, 34px)) 20px 4px 20px;
            flex-shrink: 0;
            z-index: 15;
        }

        .neon-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 9999px;
            background: rgba(14, 19, 36, 0.56);
            border: 1px solid color-mix(in srgb, var(--neon-1) 32%, rgba(255, 255, 255, 0.14));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 0 14px color-mix(in srgb, var(--neon-1) 20%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-variant-numeric: tabular-nums;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .neon-status-pill.battery-pill {
            border-color: color-mix(in srgb, var(--neon-2) 36%, rgba(255, 255, 255, 0.14));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 0 14px color-mix(in srgb, var(--neon-2) 22%, transparent);
        }

        .neon-clock-text {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(90deg, #ffffff 15%, var(--neon-1) 95%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px color-mix(in srgb, var(--neon-1) 45%, transparent);
        }

        .neon-battery-text {
            font-size: 11px;
            font-weight: 700;
            color: #f8fafc;
            text-shadow: 0 0 8px color-mix(in srgb, var(--neon-2) 55%, transparent);
        }

        .battery-shell {
            position: relative;
            width: 22px;
            height: 11px;
            border-radius: 3.5px;
            padding: 1.5px;
            border: 1.3px solid var(--neon-1);
            box-shadow: 0 0 8px color-mix(in srgb, var(--neon-1) 55%, transparent);
            display: flex;
            align-items: center;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .battery-shell::after {
            content: '';
            position: absolute;
            right: -3.2px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 5px;
            border-radius: 0 2px 2px 0;
            background: var(--neon-1);
            box-shadow: 0 0 6px var(--neon-1);
        }

        .battery-fill {
            height: 100%;
            width: 85%;
            border-radius: 1.8px;
            background: linear-gradient(90deg, var(--neon-1), var(--neon-2));
            box-shadow: 0 0 6px var(--neon-1);
            transition: width 0.5s var(--ios-ease), background 0.4s ease;
        }

        .battery-pill.is-low .battery-shell {
            border-color: #ff2e93;
            box-shadow: 0 0 8px rgba(255, 46, 147, 0.7);
        }
        .battery-pill.is-low .battery-shell::after { background: #ff2e93; }
        .battery-pill.is-low .battery-fill {
            background: linear-gradient(90deg, #ff2e93, #ff8a00);
        }

        .segmented-tabs-bar {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: center;
            padding: 4px;
            border-radius: 9999px;
            background: linear-gradient(145deg, var(--glass-bg-start), var(--glass-bg-end));
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 8px 20px rgba(0, 0, 0, 0.34);
            overflow: hidden;
            transition: background 0.35s var(--ios-ease), border-color 0.35s var(--ios-ease);
        }

        .tab-glider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            right: 4px;
            width: calc((100% - 8px) / 3);
            border-radius: 9999px;
            background: linear-gradient(135deg, var(--neon-1), var(--neon-2));
            box-shadow:
                0 4px 16px color-mix(in srgb, var(--neon-1) 42%, transparent),
                inset 0 1px 0 rgba(255, 255, 255, 0.48);
            transition: transform 0.44s cubic-bezier(0.22, 1.18, 0.36, 1), background 0.35s ease;
            will-change: transform;
            pointer-events: none;
            z-index: 1;
        }

        .segmented-tab-btn {
            position: relative;
            z-index: 2;
            padding: 7px 6px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.78);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: color 0.3s ease, transform 0.2s var(--ios-spring);
            white-space: nowrap;
        }
        .segmented-tab-btn:active { transform: scale3d(0.94, 0.94, 1); }
        .segmented-tab-btn.is-active { color: #060912; font-weight: 800; }

        .neon-circle-btn {
            position: relative;
            overflow: visible;
            background: linear-gradient(145deg, color-mix(in srgb, var(--track-color-1) 18%, rgba(34, 44, 74, 0.88)), rgba(14, 19, 36, 0.94));
            border: 1.5px solid color-mix(in srgb, var(--track-color-1) 68%, rgba(255, 255, 255, 0.22));
            color: color-mix(in srgb, var(--track-color-1) 45%, #ffffff);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                0 0 18px color-mix(in srgb, var(--track-color-1) 38%, transparent);
            transition: transform 0.2s var(--ios-spring), border-color 0.45s var(--ios-ease), box-shadow 0.45s var(--ios-ease), background 0.45s var(--ios-ease), color 0.45s var(--ios-ease);
        }

        .neon-circle-btn.next-accent {
            background: linear-gradient(145deg, color-mix(in srgb, var(--track-color-2) 18%, rgba(34, 44, 74, 0.88)), rgba(14, 19, 36, 0.94));
            border-color: color-mix(in srgb, var(--track-color-2) 68%, rgba(255, 255, 255, 0.22));
            color: color-mix(in srgb, var(--track-color-2) 45%, #ffffff);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                0 0 18px color-mix(in srgb, var(--track-color-2) 38%, transparent);
        }

        .mini-nav-btn {
            position: relative;
            overflow: visible;
            background: linear-gradient(145deg, color-mix(in srgb, var(--track-color-1) 15%, var(--glass-btn-start)), var(--glass-btn-end));
            border: 1px solid color-mix(in srgb, var(--track-color-1) 52%, var(--glass-border));
            color: color-mix(in srgb, var(--track-color-1) 38%, #ffffff);
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 0 12px color-mix(in srgb, var(--track-color-1) 28%, transparent);
            transition: transform 0.2s var(--ios-spring), border-color 0.45s var(--ios-ease), box-shadow 0.45s var(--ios-ease), background 0.45s var(--ios-ease), color 0.45s var(--ios-ease);
        }

        .mini-nav-btn.next-accent {
            background: linear-gradient(145deg, color-mix(in srgb, var(--track-color-2) 15%, var(--glass-btn-start)), var(--glass-btn-end));
            border-color: color-mix(in srgb, var(--track-color-2) 52%, var(--glass-border));
            color: color-mix(in srgb, var(--track-color-2) 38%, #ffffff);
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 0 12px color-mix(in srgb, var(--track-color-2) 28%, transparent);
        }

        .mini-nav-btn:active,
        .neon-circle-btn:active { transform: scale3d(0.86, 0.86, 1); }

        .neon-play-btn {
            position: relative;
            overflow: visible;
            background: linear-gradient(135deg, var(--track-color-1), var(--track-color-2));
            box-shadow:
                0 0 28px color-mix(in srgb, var(--track-color-1) 55%, transparent),
                0 10px 24px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.55);
            transition: transform 0.22s var(--ios-spring), background 0.45s var(--ios-ease), box-shadow 0.45s var(--ios-ease);
        }

        .neon-play-btn:active { transform: scale3d(0.9, 0.9, 1); }

        .mini-play-btn-reactive {
            position: relative;
            overflow: visible;
            border-color: color-mix(in srgb, var(--track-color-1) 42%, var(--glass-border));
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 0 14px color-mix(in srgb, var(--track-color-1) 25%, transparent);
            transition: transform 0.2s var(--ios-spring), border-color 0.45s ease, box-shadow 0.45s ease;
        }

        .play-morph-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .morph-icon {
            position: absolute;
            transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.26s ease;
            will-change: transform, opacity;
        }

        .morph-icon.play-layer {
            opacity: 1;
            transform: scale3d(1, 1, 1) rotate(0deg);
        }

        .morph-icon.pause-layer {
            opacity: 0;
            transform: scale3d(0.45, 0.45, 1) rotate(-75deg);
        }

        .is-playing-btn .morph-icon.play-layer {
            opacity: 0;
            transform: scale3d(0.45, 0.45, 1) rotate(75deg);
        }

        .is-playing-btn .morph-icon.pause-layer {
            opacity: 1;
            transform: scale3d(1, 1, 1) rotate(0deg);
        }

        .nav-icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        .home-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.52s var(--ios-ease), opacity 0.45s var(--ios-ease);
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
        }

        .home-layer.is-receded {
            transform: scale3d(0.94, 0.94, 1) translate3d(0, 8px, 0);
            opacity: 0.42;
            pointer-events: none;
        }

        .search-bar-glass {
            background: linear-gradient(145deg, var(--glass-bg-start) 0%, var(--glass-bg-end) 100%);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 6px 18px rgba(0, 0, 0, 0.34);
            transition: border-color 0.3s var(--ios-ease), box-shadow 0.3s var(--ios-ease), background 0.35s var(--ios-ease);
        }

        .search-bar-glass:focus-within {
            border-color: color-mix(in srgb, var(--neon-1) 68%, rgba(255, 255, 255, 0.25));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 0 20px color-mix(in srgb, var(--neon-1) 28%, transparent);
        }

        .search-input-field {
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        .mini-player-wrap {
            transition: transform 0.44s var(--ios-spring), opacity 0.3s ease;
            will-change: transform, opacity;
        }

        .mini-player-wrap.is-hidden {
            transform: translate3d(0, 28px, 0) scale3d(0.94, 0.94, 1);
            opacity: 0;
            pointer-events: none;
        }

        #mini-player.is-playing {
            border-color: color-mix(in srgb, var(--track-color-1) 48%, var(--glass-border));
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 12px 28px rgba(0, 0, 0, 0.48),
                0 0 24px color-mix(in srgb, var(--track-color-1) 24%, transparent);
        }

        #mini-cover.is-playing {
            box-shadow: 0 0 16px color-mix(in srgb, var(--track-color-1) 52%, transparent);
        }

        #mini-progress {
            position: relative;
            transition: transform 0.22s linear;
            box-shadow: 0 0 10px color-mix(in srgb, var(--track-color-1) 70%, transparent);
        }

        #mini-progress::after {
            content: '';
            position: absolute;
            right: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 6px;
            border-radius: 9999px;
            background: #ffffff;
            box-shadow: 0 0 8px var(--track-color-1), 0 0 12px var(--track-color-2);
        }

        .full-player-sheet {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 18%, color-mix(in srgb, var(--track-color-1) 24%, #0d1326) 0%, #060912 72%);
            transform: translate3d(0, 100%, 0);
            opacity: 0;
            pointer-events: none;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: transform 0.54s var(--ios-ease), opacity 0.36s var(--ios-ease);
            will-change: transform, opacity;
        }

        .full-player-sheet.is-open {
            transform: translate3d(0, 0, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .liquid-reveal-1,
        .liquid-reveal-2,
        .liquid-reveal-3 {
            opacity: 0;
            transform: translate3d(0, 18px, 0) scale3d(0.97, 0.97, 1);
            transition: transform 0.55s var(--ios-ease), opacity 0.42s var(--ios-ease);
            will-change: transform, opacity;
        }

        .full-player-sheet.is-open .liquid-reveal-1 {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
            transition-delay: 0.06s;
        }

        .full-player-sheet.is-open .liquid-reveal-2 {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
            transition-delay: 0.11s;
        }

        .full-player-sheet.is-open .liquid-reveal-3 {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
            transition-delay: 0.16s;
        }

        .settings-sheet {
            position: absolute;
            inset: 0;
            z-index: 55;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(5, 8, 17, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.36s var(--ios-ease), background 0.38s var(--ios-ease), backdrop-filter 0.38s var(--ios-ease);
        }

        .settings-sheet.is-open {
            opacity: 1;
            pointer-events: auto;
            background: rgba(5, 8, 17, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .settings-card {
            width: 88%;
            max-width: 332px;
            max-height: 78%;
            overflow-y: auto;
            border-radius: 26px;
            background: linear-gradient(155deg, rgba(22, 28, 48, 0.92) 0%, rgba(10, 14, 26, 0.96) 100%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.24),
                0 20px 50px rgba(0, 0, 0, 0.65),
                0 0 28px color-mix(in srgb, var(--neon-1) 18%, transparent);
            transform-origin: center center;
            will-change: transform, opacity, border-radius;
            opacity: 0;
        }

        .settings-card .liquid-glass {
            background: linear-gradient(145deg, var(--settings-surface-start) 0%, var(--settings-surface-end) 100%);

            height: 18px;

            background: #ffffff;

    <script>
        const isNativeAndroid = typeof window.AndroidBridge !== 'undefined';

        const neonThemes = [

            { name: 'صورتی و نارنجی نئون', n1: '#ff2e93', n2: '#ff8a00', n3: '#b537f2' },

            { name: 'طلایی و سرخابی', n1: '#ffe600', n2: '#ff006e', n3: '#3a86ff' }
        ];

        const tracks = [
            {
                id: 1,
                title: 'Midnight Liquid',
                artist: 'Neon Pulse • Liquid Audio',
                duration: 28,
                favorite: true,
                colors: ['#00f0ff', '#b537f2'],
                notes: [261.63, 329.63, 392.00, 493.88],
                audioUrl: null,
                artThumbUrl: null,
                artFullUrl: null,
                isNative: false,
                nativeIndex: -1
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let activeTab = 'all';
        let selectedArtist = null;
        let searchQuery = '';
        let themeIndex = 0;
        let currentTimeSec = 0;
        let progressTimer = null;
        let isFullPlayerOpen = false;
        let isSeeking = false;
        let activeCardEl = null;
        let pressedCardEl = null;
        let lastSlideDirection = 0;

        let wavePhase = 0;
        let waveEnergy = 0.2;
        let smoothProgress = 0;
        let waveAnimId = null;
        let lastWaveTimestamp = 0;
        let cachedWaveWidth = 0;
        let cachedWaveHeight = 0;

        const trackListEl = document.getElementById('track-list');
        const homeLayer = document.getElementById('home-layer');
        const miniPlayerWrap = document.getElementById('mini-player-wrap');
        const fullPlayer = document.getElementById('full-player');
        const seekSlider = document.getElementById('seek-slider');
        const waveCanvas = document.getElementById('wave-seek-canvas');
        const waveCtx = waveCanvas ? waveCanvas.getContext('2d') : null;
        const toastEl = document.getElementById('toast');
        const toastTextEl = document.getElementById('toast-text');
        const toastDotEl = document.getElementById('toast-dot');
        const searchInputEl = document.getElementById('fast-search-input');
        const searchClearBtn = document.getElementById('fast-search-clear');
        const searchCountEl = document.getElementById('fast-search-count');
        const tabGliderEl = document.getElementById('tab-glider');
        const tabAllBtn = document.getElementById('tab-all');
        const tabFavBtn = document.getElementById('tab-fav');
        const tabArtistsBtn = document.getElementById('tab-artists');

        const GLASS_STYLE_STORAGE_KEY = 'neon_liquid_glass_style_v1';
        const GLASS_OPACITY_STORAGE_KEY = 'neon_liquid_glass_opacity_v1';
        let glassStyle = 'dark';
        let glassOpacityPct = 82;

        function applyGlassAppearance(style, opacityPct, persist = false) {
            glassStyle = style === 'ice' ? 'ice' : 'dark';
            glassOpacityPct = Math.max(15, Math.min(98, Number(opacityPct) || 82));

            const root = document.documentElement;
            const alpha = glassOpacityPct / 100;

            if (glassStyle === 'ice') {
                const a1 = Math.min(0.68, alpha * 0.44).toFixed(3);
                const a2 = Math.min(0.56, alpha * 0.30).toFixed(3);
                const b1 = Math.min(0.74, alpha * 0.50).toFixed(3);
                const b2 = Math.min(0.60, alpha * 0.34).toFixed(3);
                const borderA = (0.26 + alpha * 0.34).toFixed(3);
                const hiA = (0.38 + alpha * 0.44).toFixed(3);
                const blurPx = Math.round(14 + alpha * 16);

                root.style.setProperty('--glass-bg-start', `rgba(225, 240, 255, ${a1})`);
                root.style.setProperty('--glass-bg-end', `rgba(185, 212, 245, ${a2})`);
                root.style.setProperty('--glass-btn-start', `rgba(235, 245, 255, ${b1})`);
                root.style.setProperty('--glass-btn-end', `rgba(195, 220, 250, ${b2})`);
                root.style.setProperty('--glass-border', `rgba(255, 255, 255, ${borderA})`);
                root.style.setProperty('--glass-highlight', `rgba(255, 255, 255, ${hiA})`);
                root.style.setProperty('--glass-blur', `${blurPx}px`);
                root.style.setProperty('--glass-saturate', '185%');
                root.style.setProperty('--glass-shadow', '0 10px 28px rgba(4, 10, 24, 0.34)');
            } else {
                const a1 = Math.max(0.14, alpha * 0.94).toFixed(3);
                const a2 = Math.max(0.18, Math.min(0.98, alpha * 1.03)).toFixed(3);
                const b1 = Math.max(0.16, Math.min(0.96, alpha * 0.98)).toFixed(3);
                const b2 = Math.max(0.20, Math.min(0.98, alpha * 1.05)).toFixed(3);
                const borderA = (0.10 + alpha * 0.14).toFixed(3);
                const hiA = (0.14 + alpha * 0.18).toFixed(3);
                const blurPx = Math.round(10 + (1 - alpha) * 14);

                root.style.setProperty('--glass-bg-start', `rgba(32, 40, 68, ${a1})`);
                root.style.setProperty('--glass-bg-end', `rgba(16, 21, 38, ${a2})`);
                root.style.setProperty('--glass-btn-start', `rgba(44, 54, 88, ${b1})`);
                root.style.setProperty('--glass-btn-end', `rgba(22, 28, 50, ${b2})`);
                root.style.setProperty('--glass-border', `rgba(255, 255, 255, ${borderA})`);
                root.style.setProperty('--glass-highlight', `rgba(255, 255, 255, ${hiA})`);
                root.style.setProperty('--glass-blur', `${blurPx}px`);
                root.style.setProperty('--glass-saturate', '135%');
                root.style.setProperty('--glass-shadow', '0 10px 26px rgba(0, 0, 0, 0.42)');
            }

            const badge = document.getElementById('glass-opacity-badge');
            const slider = document.getElementById('glass-opacity-slider');
            if (badge) badge.textContent = `${glassOpacityPct}%`;
            if (slider && Number(slider.value) !== glassOpacityPct) slider.value = glassOpacityPct;

            document.querySelectorAll('.glass-style-btn').forEach(btn => {
                btn.classList.toggle('is-selected', btn.getAttribute('data-glass-style') === glassStyle);
            });

            if (persist) {
                try {
                    localStorage.setItem(GLASS_STYLE_STORAGE_KEY, glassStyle);
                    localStorage.setItem(GLASS_OPACITY_STORAGE_KEY, String(glassOpacityPct));
                } catch (_) {}
            }
        }

        function initGlassAppearance() {
            let savedStyle = 'dark';
            let savedOpacity = 82;
            try {
                const s = localStorage.getItem(GLASS_STYLE_STORAGE_KEY);
                const o = localStorage.getItem(GLASS_OPACITY_STORAGE_KEY);
                if (s === 'ice' || s === 'dark') savedStyle = s;
                if (o !== null && !isNaN(Number(o))) savedOpacity = Number(o);
            } catch (_) {}
            applyGlassAppearance(savedStyle, savedOpacity, false);

            document.querySelectorAll('.glass-style-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const nextStyle = btn.getAttribute('data-glass-style') || 'dark';
                    const defaultOpacityForStyle = nextStyle === 'ice' ? 46 : 82;
                    applyGlassAppearance(nextStyle, defaultOpacityForStyle, true);
                    showToast(nextStyle === 'ice' ? 'حالت شیشه یخی فعال شد ❄️' : 'حالت شیشه دارک فعال شد 🌑');
                });
            });

            const opacitySlider = document.getElementById('glass-opacity-slider');
            if (opacitySlider) {
                opacitySlider.addEventListener('input', (e) => {
                    applyGlassAppearance(glassStyle, Number(e.target.value), true);
                });
            }
        }

        function updateNeonClock() {
            const clockEl = document.getElementById('neon-status-clock');
            if (!clockEl) return;
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            clockEl.textContent = `${hh}:${mm}`;
        }

        function applyBatteryState(levelRatio, charging) {
            const pct = Math.max(1, Math.min(100, Math.round(levelRatio * 100)));
            const textEl = document.getElementById('neon-battery-text');
            const fillEl = document.getElementById('neon-battery-fill');
            const pillEl = document.getElementById('neon-battery-pill');
            const boltEl = document.getElementById('neon-battery-bolt');
            if (textEl) textEl.textContent = `${pct}%`;
            if (fillEl) fillEl.style.width = `${pct}%`;
            if (pillEl) pillEl.classList.toggle('is-low', pct <= 20 && !charging);
            if (boltEl) boltEl.classList.toggle('hidden', !charging);
        }

        function initNeonStatusBar() {
            updateNeonClock();
            setInterval(updateNeonClock, 10000);

            if (isNativeAndroid && typeof window.AndroidBridge.getBatteryJson === 'function') {
                const syncNativeBat = () => {
                    try {
                        const raw = window.AndroidBridge.getBatteryJson();
                        if (raw) {
                            const info = JSON.parse(raw);
                            if (info && typeof info.level === 'number' && info.level >= 0) {
                                applyBatteryState(info.level / 100, Boolean(info.charging));
                            }
                        }
                    } catch (_) {}
                };
                syncNativeBat();
                setInterval(syncNativeBat, 30000);
                return;
            }

            if (navigator.getBattery) {
                navigator.getBattery().then((battery) => {
                    const syncBat = () => applyBatteryState(battery.level, battery.charging);
                    syncBat();
                    battery.addEventListener('levelchange', syncBat);
                    battery.addEventListener('chargingchange', syncBat);
                }).catch(() => {});
            }
        }

        let toastTimeout = null;
        let lastToastSourceEl = null;

        function animateButtonDropletGulp(btnEl) {
            if (!btnEl || typeof btnEl.animate !== 'function') return;
            if (btnEl._gulpAnim) btnEl._gulpAnim.cancel();
            btnEl._gulpAnim = btnEl.animate(
                [
                    { transform: 'scale3d(1, 1, 1)', offset: 0 },
                    { transform: 'scale3d(1.22, 0.84, 1)', offset: 0.24 },
                    { transform: 'scale3d(0.90, 1.12, 1)', offset: 0.52 },
                    { transform: 'scale3d(1.05, 0.97, 1)', offset: 0.78 },
                    { transform: 'scale3d(1, 1, 1)', offset: 1 }
                ],
                { duration: 480, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
            );
        }

        function hideToastDroplet(sourceEl) {
            if (!toastEl) return;
            const targetBtn = sourceEl || lastToastSourceEl;
            if (!targetBtn || typeof toastEl.animate !== 'function') {
                toastEl.style.opacity = '0';
                return;
            }
            if (toastEl._dropAnim) toastEl._dropAnim.cancel();

            const shellRect = document.getElementById('app-shell').getBoundingClientRect();
            const btnRect = targetBtn.getBoundingClientRect();
            const toastRect = toastEl.getBoundingClientRect();

            const toastTopPx = parseFloat(getComputedStyle(toastEl).top) || 32;
            const btnCenterX = (btnRect.left - shellRect.left) + btnRect.width * 0.5;
            const btnCenterY = (btnRect.top - shellRect.top) + btnRect.height * 0.5;
            const targetCenterX = shellRect.width * 0.5;
            const targetCenterY = toastTopPx + (toastRect.height || 24) * 0.5;

            const dx = btnCenterX - targetCenterX;
            const dy = btnCenterY - targetCenterY;

            const midX = dx * 0.42;
            const midY = dy * 0.32 - 3;

            const textNode = toastTextEl || toastEl;
            if (textNode && typeof textNode.animate === 'function') {
                if (textNode._txtAnim) textNode._txtAnim.cancel();
                textNode._txtAnim = textNode.animate(
                    [
                        { opacity: 1, transform: 'scale3d(1, 1, 1)' },
                        { opacity: 0, transform: 'scale3d(0.65, 0.65, 1)' }
                    ],
                    { duration: 160, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
                );
            }

            toastEl._dropAnim = toastEl.animate(
                [
                    {
                        transform: 'translate3d(-50%, 0px, 0) scale3d(1, 1, 1)',
                        borderRadius: '9999px',
                        opacity: 1,
                        offset: 0
                    },
                    {
                        transform: 'translate3d(-50%, -2px, 0) scale3d(0.92, 1.06, 1)',
                        borderRadius: '9999px',
                        opacity: 0.98,
                        offset: 0.22
                    },
                    {
                        transform: `translate3d(calc(-50% + ${midX.toFixed(1)}px), ${midY.toFixed(1)}px, 0) scale3d(0.44, 0.34, 1)`,
                        borderRadius: '9999px',
                        opacity: 0.9,
                        offset: 0.62
                    },
                    {
                        transform: `translate3d(calc(-50% + ${dx.toFixed(1)}px), ${dy.toFixed(1)}px, 0) scale3d(0.08, 0.08, 1)`,
                        borderRadius: '9999px',
                        opacity: 0,
                        offset: 1
                    }
                ],
                { duration: 420, easing: 'cubic-bezier(0.32, 0, 0.68, 0.22)', fill: 'forwards' }
            );

            setTimeout(() => animateButtonDropletGulp(targetBtn), 340);
        }

        function showToast(msg, sourceEl = null) {
            if (!toastEl) return;
            if (toastTextEl) {
                if (toastTextEl._txtAnim) {
                    toastTextEl._txtAnim.cancel();
                    toastTextEl._txtAnim = null;
                }
                toastTextEl.textContent = msg;
                toastTextEl.style.opacity = '1';
                toastTextEl.style.transform = 'scale3d(1, 1, 1)';
            } else {
                toastEl.textContent = msg;
            }
            if (toastDotEl) {
                toastDotEl.style.background = 'var(--neon-1)';
                toastDotEl.style.boxShadow = '0 0 6px var(--neon-1)';
            }

            if (toastTimeout) clearTimeout(toastTimeout);
            if (toastEl._dropAnim) {
                toastEl._dropAnim.cancel();
                toastEl._dropAnim = null;
            }

            const originBtn = sourceEl || null;
            lastToastSourceEl = originBtn;

            if (!originBtn || typeof toastEl.animate !== 'function') {
                toastEl.style.opacity = '1';
                toastEl.style.transform = 'translate3d(-50%, 0, 0) scale3d(1, 1, 1)';
                toastTimeout = setTimeout(() => {
                    toastEl.style.opacity = '0';
                }, 1900);
                return;
            }

            const shellRect = document.getElementById('app-shell').getBoundingClientRect();
            const btnRect = originBtn.getBoundingClientRect();
            const toastTopPx = parseFloat(getComputedStyle(toastEl).top) || 32;
            const toastH = toastEl.offsetHeight || 24;

            const btnCenterX = (btnRect.left - shellRect.left) + btnRect.width * 0.5;
            const btnCenterY = (btnRect.top - shellRect.top) + btnRect.height * 0.5;
            const targetCenterX = shellRect.width * 0.5;
            const targetCenterY = toastTopPx + toastH * 0.5;

            const dx = btnCenterX - targetCenterX;
            const dy = btnCenterY - targetCenterY;

            toastEl.style.opacity = '1';
            toastEl._dropAnim = toastEl.animate(
                [
                    {
                        transform: `translate3d(calc(-50% + ${dx.toFixed(1)}px), ${dy.toFixed(1)}px, 0) scale3d(0.06, 0.06, 1)`,
                        borderRadius: '9999px',
                        opacity: 0.25,
                        offset: 0
                    },
                    {
                        transform: `translate3d(calc(-50% + ${(dx * 0.25).toFixed(1)}px), ${(dy * 0.22 - 4).toFixed(1)}px, 0) scale3d(0.78, 0.94, 1)`,
                        borderRadius: '9999px',
                        opacity: 0.96,
                        offset: 0.45
                    },
                    {
                        transform: 'translate3d(-50%, -2px, 0) scale3d(1.04, 0.97, 1)',
                        borderRadius: '9999px',
                        opacity: 1,
                        offset: 0.78
                    },
                    {
                        transform: 'translate3d(-50%, 0px, 0) scale3d(1, 1, 1)',
                        borderRadius: '9999px',
                        opacity: 1,
                        offset: 1
                    }
                ],
                { duration: 480, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
            );

            toastTimeout = setTimeout(() => hideToastDroplet(originBtn), 1850);
        }

        function formatTime(sec) {
            const s = Math.max(0, Math.floor(sec || 0));
            const mins = Math.floor(s / 60);
            const secs = s % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function normalizeSearchText(str) {

        function applyCoverArt(imgEl, iconEl, artUrl) {
            if (!imgEl) return;
            const nextSrc = artUrl || '';
            if (!nextSrc) {
                imgEl.dataset.src = '';
                imgEl.style.display = 'none';
                imgEl.removeAttribute('src');
                if (iconEl) iconEl.style.display = '';
                return;
            }
            if (imgEl.dataset.src === nextSrc && imgEl.complete && imgEl.naturalWidth > 0) {
                imgEl.style.display = 'block';
                if (iconEl) iconEl.style.display = 'none';
                return;
            }
            imgEl.dataset.src = nextSrc;
            imgEl.onload = () => {
                if (imgEl.dataset.src !== nextSrc) return;
                imgEl.style.display = 'block';
                if (iconEl) iconEl.style.display = 'none';
            };
            imgEl.onerror = () => {
                if (imgEl.dataset.src !== nextSrc) return;
                if (nextSrc.includes('q=thumb')) {
                    const fullAlt = nextSrc.replace('q=thumb', 'q=full');
                    imgEl.dataset.src = fullAlt;
                    imgEl.src = fullAlt;
                    return;
                }
                imgEl.style.display = 'none';
                if (iconEl) iconEl.style.display = '';
            };
            imgEl.src = nextSrc;
            if (imgEl.complete && imgEl.naturalWidth > 0) {
                imgEl.style.display = 'block';
                if (iconEl) iconEl.style.display = 'none';
            }
        }

        function extractLocalAudioArtwork(file) {
            return new Promise((resolve) => {
                try {
                    const slice = file.slice(0, 524288);
                    const reader = new FileReader();
                    reader.onload = () => {
                        try {
                            const buf = new Uint8Array(reader.result);
                            let jpegStart = -1;
                            for (let i = 0; i < buf.length - 3; i++) {
                                if (buf[i] === 0xFF && buf[i + 1] === 0xD8 && buf[i + 2] === 0xFF) {
                                    jpegStart = i;
                                    break;
                                }
                            }
                            if (jpegStart >= 0) {
                                let jpegEnd = -1;
                                for (let j = jpegStart + 2; j < buf.length - 1; j++) {
                                    if (buf[j] === 0xFF && buf[j + 1] === 0xD9) {
                                        jpegEnd = j + 2;
                                        break;
                                    }
                                }
                                if (jpegEnd > jpegStart + 100) {
                                    const imgBlob = new Blob([buf.slice(jpegStart, jpegEnd)], { type: 'image/jpeg' });
                                    resolve(URL.createObjectURL(imgBlob));
                                    return;
                                }
                            }
                            for (let i = 0; i < buf.length - 8; i++) {
                                if (buf[i] === 0x89 && buf[i + 1] === 0x50 && buf[i + 2] === 0x4E && buf[i + 3] === 0x47) {
                                    for (let j = i + 8; j < buf.length - 8; j++) {
                                        if (buf[j] === 0x49 && buf[j + 1] === 0x45 && buf[j + 2] === 0x4E && buf[j + 3] === 0x44) {
                                            const pngBlob = new Blob([buf.slice(i, j + 8)], { type: 'image/png' });
                                            resolve(URL.createObjectURL(pngBlob));
                                            return;
                                        }
                                    }
                                }
                            }
                        } catch (_) {}
                        resolve(null);
                    };
                    reader.onerror = () => resolve(null);
                    reader.readAsArrayBuffer(slice);
                } catch (_) {
                    resolve(null);
                }
            });
        }

        const WALLPAPER_STORAGE_KEY = 'neon_liquid_home_bg_v1';

        function compressWallpaperFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('read_failed'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('decode_failed'));
                    img.onload = () => {
                        const maxDim = 1280;
                        let w = img.naturalWidth || img.width;
                        let h = img.naturalHeight || img.height;
                        if (w > maxDim || h > maxDim) {
                            const scale = maxDim / Math.max(w, h);
                            w = Math.round(w * scale);
                            h = Math.round(h * scale);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function initHomeWallpaper() {
            try {

                    try {
                        const compressedUrl = await compressWallpaperFile(file);

        }

        const WEATHER_MODE_STORAGE_KEY = 'neon_liquid_weather_mode_v1';
        const weatherCanvas = document.getElementById('weather-canvas');
        const weatherCtx = weatherCanvas ? weatherCanvas.getContext('2d') : null;
        const weatherStatusTitle = document.getElementById('weather-status-title');
        const weatherStatusSub = document.getElementById('weather-status-sub');
        const refreshWeatherBtn = document.getElementById('refresh-weather-btn');

        let weatherMode = 'auto';
        let liveDetectedWeather = 'none';
        let effectiveWeather = 'none';
        let weatherAnimId = null;
        let weatherParticles = [];
        let weatherSplashes = [];
        let weatherW = 0;
        let weatherH = 0;
        let lastWeatherTs = 0;
        let snowTime = 0;
        let snowWindCurrent = 0;
        let snowWindTarget = 0;
        let snowWindTimer = 0;

        function resizeWeatherCanvas() {
            if (!weatherCanvas || !weatherCtx) return;
            const rect = weatherCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            weatherW = rect.width;
            weatherH = rect.height;
            weatherCanvas.width = Math.round(rect.width * dpr);
            weatherCanvas.height = Math.round(rect.height * dpr);
            weatherCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function createWeatherParticles(type) {
            weatherParticles = [];
            weatherSplashes = [];
            const w = weatherW || 380;
            const h = weatherH || 780;

            if (type === 'rain') {
                const count = 78;
                for (let i = 0; i < count; i++) {
                    const depth = Math.random();
                    weatherParticles.push({
                        x: Math.random() * (w + 90) - 45,
                        y: Math.random() * h,
                        len: 12 + depth * 22,
                        speed: 440 + depth * 360,
                        drift: -38 - depth * 28,
                        alpha: 0.18 + depth * 0.44,
                        width: 0.9 + depth * 1.1,
                        tint: i % 3 === 0 ? 'neon' : 'ice'
                    });
                }
            } else if (type === 'snow') {
                snowTime = 0;
                snowWindCurrent = 0.18;
                snowWindTarget = 0.25;
                snowWindTimer = 0;
                const count = 88;
                for (let i = 0; i < count; i++) {
                    const roll = Math.random();
                    const layer = roll < 0.44 ? 0 : (roll < 0.80 ? 1 : 2);
                    const depth = layer === 0
                        ? Math.random() * 0.32
                        : (layer === 1 ? 0.34 + Math.random() * 0.34 : 0.70 + Math.random() * 0.30);

                    weatherParticles.push({
                        layer,
                        x: Math.random() * (w + 60) - 30,
                        y: Math.random() * h,
                        radius: layer === 0 ? (0.85 + Math.random() * 1.0) : (layer === 1 ? (1.8 + Math.random() * 1.4) : (3.1 + Math.random() * 2.1)),
                        speed: layer === 0 ? (14 + Math.random() * 14) : (layer === 1 ? (28 + Math.random() * 20) : (48 + Math.random() * 26)),
                        swayAmp1: layer === 0 ? (6 + Math.random() * 8) : (layer === 1 ? (14 + Math.random() * 14) : (22 + Math.random() * 18)),
                        swayFreq1: 0.45 + Math.random() * 0.65,
                        swayAmp2: 3 + depth * 8,
                        swayFreq2: 1.1 + Math.random() * 1.1,
                        phase1: Math.random() * Math.PI * 2,
                        phase2: Math.random() * Math.PI * 2,
                        flutterFreq: 1.4 + Math.random() * 1.8,
                        flutterPhase: Math.random() * Math.PI * 2,
                        twinkleFreq: 0.9 + Math.random() * 1.6,
                        twinklePhase: Math.random() * Math.PI * 2,
                        alpha: layer === 0 ? (0.24 + Math.random() * 0.24) : (layer === 1 ? (0.48 + Math.random() * 0.28) : (0.68 + Math.random() * 0.28)),
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * (0.45 + depth * 0.9),
                        crystal: layer === 2 && i % 2 === 0,
                        tint: i % 5 === 0 ? 'neon' : 'white'
                    });
                }
            }
        }

        function drawCrystalFlake(ctx, radius, alpha, isNeon, neonHex) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = isNeon ? neonHex : '#ffffff';
            ctx.lineWidth = Math.max(0.85, radius * 0.22);
            ctx.lineCap = 'round';
            for (let a = 0; a < 3; a++) {
                ctx.rotate(Math.PI / 3);
                ctx.beginPath();
                ctx.moveTo(-radius, 0);
                ctx.lineTo(radius, 0);
                ctx.stroke();

                const bPos = radius * 0.52;
                const bLen = radius * 0.34;
                ctx.beginPath();
                ctx.moveTo(bPos, 0);
                ctx.lineTo(bPos + bLen * 0.6, -bLen * 0.7);
                ctx.moveTo(bPos, 0);
                ctx.lineTo(bPos + bLen * 0.6, bLen * 0.7);
                ctx.moveTo(-bPos, 0);
                ctx.lineTo(-bPos - bLen * 0.6, -bLen * 0.7);
                ctx.moveTo(-bPos, 0);
                ctx.lineTo(-bPos - bLen * 0.6, bLen * 0.7);
                ctx.stroke();
            }
            ctx.restore();
        }

        function weatherTick(ts) {
            if (effectiveWeather === 'none' || !weatherCtx) {
                weatherAnimId = null;
                return;
            }
            const dt = lastWeatherTs ? Math.min(0.05, (ts - lastWeatherTs) / 1000) : 0.016;
            lastWeatherTs = ts;

            if (!weatherW || !weatherH) resizeWeatherCanvas();
            const w = weatherW || 380;
            const h = weatherH || 780;
            const neon1 = getComputedStyle(document.documentElement).getPropertyValue('--neon-1').trim() || '#00f0ff';

            weatherCtx.clearRect(0, 0, w, h);

            if (effectiveWeather === 'rain') {
                for (let i = 0; i < weatherParticles.length; i++) {
                    const p = weatherParticles[i];
                    p.x += p.drift * dt;
                    p.y += p.speed * dt;

                    if (p.y > h + 10) {
                        if (weatherSplashes.length < 24 && Math.random() < 0.45) {
                            weatherSplashes.push({
                                x: Math.max(12, Math.min(w - 12, p.x)),
                                y: h - 4 - Math.random() * 14,
                                r: 1,
                                maxR: 6 + Math.random() * 6,
                                alpha: p.alpha * 0.9,
                                neon: p.tint === 'neon'
                            });
                        }
                        p.y = -20 - Math.random() * 40;
                        p.x = Math.random() * (w + 90) - 45;
                    }
                    if (p.x < -50) p.x += w + 90;

                    const angle = Math.atan2(p.speed, p.drift);
                    const ex = p.x - Math.cos(angle) * p.len;
                    const ey = p.y - Math.sin(angle) * p.len;

                    const grad = weatherCtx.createLinearGradient(ex, ey, p.x, p.y);
                    grad.addColorStop(0, 'rgba(255,255,255,0)');
                    grad.addColorStop(1, p.tint === 'neon' ? neon1 : 'rgba(220, 245, 255, 0.95)');

                    weatherCtx.save();
                    weatherCtx.beginPath();
                    weatherCtx.moveTo(ex, ey);
                    weatherCtx.lineTo(p.x, p.y);
                    weatherCtx.strokeStyle = grad;
                    weatherCtx.globalAlpha = p.alpha;
                    weatherCtx.lineWidth = p.width;
                    weatherCtx.lineCap = 'round';
                    weatherCtx.stroke();
                    weatherCtx.restore();
                }

                for (let j = weatherSplashes.length - 1; j >= 0; j--) {
                    const s = weatherSplashes[j];                    s.r += 24 * dt;
                    s.alpha -= 1.45 * dt;
                    if (s.alpha <= 0 || s.r >= s.maxR) {
                        weatherSplashes.splice(j, 1);
                        continue;
                    }
                    weatherCtx.save();
                    weatherCtx.beginPath();
                    weatherCtx.ellipse(s.x, s.y, s.r, s.r * 0.34, 0, 0, Math.PI * 2);
                    weatherCtx.strokeStyle = s.neon ? neon1 : '#e0f7ff';
                    weatherCtx.globalAlpha = Math.max(0, s.alpha);
                    weatherCtx.lineWidth = 1;
                    weatherCtx.stroke();
                    weatherCtx.restore();
                }
            } else if (effectiveWeather === 'snow') {
                snowTime += dt;
                snowWindTimer += dt;
                if (snowWindTimer > 4.2) {
                    snowWindTimer = 0;
                    snowWindTarget = (Math.random() - 0.42) * 0.75;
                }
                snowWindCurrent += (snowWindTarget - snowWindCurrent) * Math.min(1, dt * 0.65);

                const mistGrad = weatherCtx.createLinearGradient(0, h - 38, 0, h);
                mistGrad.addColorStop(0, 'rgba(220, 245, 255, 0)');
                mistGrad.addColorStop(1, 'rgba(215, 242, 255, 0.08)');
                weatherCtx.fillStyle = mistGrad;
                weatherCtx.fillRect(0, h - 38, w, 38);

                for (let i = 0; i < weatherParticles.length; i++) {
                    const p = weatherParticles[i];
                    const flutter = 0.84 + 0.24 * Math.sin(snowTime * p.flutterFreq + p.flutterPhase);
                    p.y += p.speed * flutter * dt;

                    const layerWindScale = p.layer === 0 ? 12 : (p.layer === 1 ? 26 : 42);
                    const vx = snowWindCurrent * layerWindScale
                        + Math.cos(snowTime * p.swayFreq1 + p.phase1) * p.swayAmp1 * 0.55
                        + Math.sin(snowTime * p.swayFreq2 + p.phase2) * p.swayAmp2 * 0.45;
                    p.x += vx * dt;
                    p.rotation += p.rotSpeed * dt;

                    if (p.y > h + 16) {
                        p.y = -14 - Math.random() * 20;
                        p.x = Math.random() * (w + 60) - 30;
                    }
                    if (p.x < -30) p.x += w + 60;
                    else if (p.x > w + 30) p.x -= w + 60;

                    const twinkle = 0.78 + 0.22 * Math.sin(snowTime * p.twinkleFreq + p.twinklePhase);
                    const finalAlpha = Math.min(1, p.alpha * twinkle);
                    const isNeon = p.tint === 'neon';

                    if (p.crystal) {
                        weatherCtx.save();
                        weatherCtx.translate(p.x, p.y);
                        weatherCtx.rotate(p.rotation);
                        const aura = weatherCtx.createRadialGradient(0, 0, 0, 0, 0, p.radius * 2.2);
                        aura.addColorStop(0, isNeon ? neon1 : 'rgba(255, 255, 255, 0.55)');
                        aura.addColorStop(1, 'rgba(255, 255, 255, 0)');
                        weatherCtx.globalAlpha = finalAlpha * 0.35;
                        weatherCtx.fillStyle = aura;
                        weatherCtx.beginPath();
                        weatherCtx.arc(0, 0, p.radius * 2.2, 0, Math.PI * 2);
                        weatherCtx.fill();
                        drawCrystalFlake(weatherCtx, p.radius * 1.15, finalAlpha * 0.92, isNeon, neon1);
                        weatherCtx.restore();
                    } else if (p.layer === 2) {
                        const glowR = p.radius * 2.5;
                        const g = weatherCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
                        g.addColorStop(0, isNeon ? neon1 : 'rgba(255, 255, 255, 0.96)');
                        g.addColorStop(0.38, isNeon ? neon1 : 'rgba(235, 248, 255, 0.55)');
                        g.addColorStop(1, 'rgba(255, 255, 255, 0)');
                        weatherCtx.save();
                        weatherCtx.globalAlpha = finalAlpha;
                        weatherCtx.fillStyle = g;
                        weatherCtx.beginPath();
                        weatherCtx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
                        weatherCtx.fill();
                        weatherCtx.restore();
                    } else {
                        weatherCtx.save();
                        weatherCtx.globalAlpha = finalAlpha;
                        weatherCtx.fillStyle = isNeon ? neon1 : '#f4fbff';
                        weatherCtx.beginPath();
                        weatherCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        weatherCtx.fill();
                        weatherCtx.restore();
                    }
                }
            }

            weatherAnimId = requestAnimationFrame(weatherTick);
        }

        function applyEffectiveWeatherEffect() {
            const target = weatherMode === 'auto' ? liveDetectedWeather : weatherMode;
            if (target === effectiveWeather) return;
            effectiveWeather = target;

            if (weatherAnimId) {
                cancelAnimationFrame(weatherAnimId);
                weatherAnimId = null;
            }

            if (effectiveWeather === 'rain' || effectiveWeather === 'snow') {
                resizeWeatherCanvas();
                createWeatherParticles(effectiveWeather);
                if (weatherCanvas) weatherCanvas.classList.add('is-active');
                lastWeatherTs = 0;
                weatherAnimId = requestAnimationFrame(weatherTick);
            } else {
                if (weatherCanvas) weatherCanvas.classList.remove('is-active');
                if (weatherCtx) weatherCtx.clearRect(0, 0, weatherW || 500, weatherH || 900);
            }
        }

        function updateWeatherModeButtonsUI() {
            document.querySelectorAll('.weather-mode-btn').forEach(btn => {
                const mode = btn.getAttribute('data-weather-mode');
                btn.classList.toggle('is-selected', mode === weatherMode);
            });
        }

        function setWeatherMode(mode, notify = true) {
            weatherMode = mode || 'auto';
            try { localStorage.setItem(WEATHER_MODE_STORAGE_KEY, weatherMode); } catch (_) {}
            updateWeatherModeButtonsUI();
            applyEffectiveWeatherEffect();

            if (weatherMode === 'rain') {
                if (weatherStatusTitle) weatherStatusTitle.textContent = '• باران دستی';
                if (weatherStatusSub) weatherStatusSub.textContent = 'پخش جلوه باران نئونی';
                if (notify) showToast('باران نئونی فعال شد 🌧️');
            } else if (weatherMode === 'snow') {
                if (weatherStatusTitle) weatherStatusTitle.textContent = '• برف دستی';
                if (weatherStatusSub) weatherStatusSub.textContent = 'پخش جلوه برف نئونی';
                if (notify) showToast('برف نئونی فعال شد ❄️');
            } else if (weatherMode === 'off') {
                if (weatherStatusTitle) weatherStatusTitle.textContent = '• خاموش';
                if (weatherStatusSub) weatherStatusSub.textContent = 'فقط نورپردازی نئونی';
                if (notify) showToast('جلوه آب‌وهوا خاموش شد');
            } else {
                if (weatherStatusTitle) weatherStatusTitle.textContent = '• خودکار';
                if (notify) showToast('حالت خودکار آب‌وهوا فعال شد 🌦️');
                syncLiveWeather(false);
            }
        }

        function classifyWmoWeather(code, rainMm = 0, snowCm = 0) {
            if (snowCm > 0 || (code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
            if (rainMm > 0 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95 && code <= 99)) return 'rain';
            return 'none';
        }

        function describeWmoWeather(code) {
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'برفی';
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'بارانی';
            if (code >= 95) return 'رعدوبرق و باران';
            if (code === 45 || code === 48) return 'مه‌آلود';
            if (code === 1 || code === 2 || code === 3) return 'نیمه‌ابری';
            return 'صاف';
        }

        window.onNativeWeatherUpdated = function(condition, tempC, cityName) {
            const norm = String(condition || '').toLowerCase();
            if (norm.includes('snow')) liveDetectedWeather = 'snow';
            else if (norm.includes('rain') || norm.includes('drizzle') || norm.includes('storm')) liveDetectedWeather = 'rain';
            else liveDetectedWeather = 'none';

            const tempLabel = typeof tempC === 'number' ? ` • ${Math.round(tempC)}°` : '';
            const placeLabel = cityName ? ` (${cityName})` : '';
            if (weatherStatusTitle) weatherStatusTitle.textContent = `${tempLabel}${placeLabel}`;
            if (weatherStatusSub) {
                weatherStatusSub.textContent = liveDetectedWeather === 'rain'
                    ? 'بارش باران فعال شد'
                    : (liveDetectedWeather === 'snow' ? 'بارش برف فعال شد' : 'بدون بارش');
            }
            applyEffectiveWeatherEffect();
        };

        async function fetchOpenMeteoWeather(lat, lon, manualToast = false) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,precipitation,rain,snowfall,weather_code&timezone=auto`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('weather_http_error');
                const data = await res.json();
                const cur = data && data.current;
                if (!cur) throw new Error('weather_empty');

                const code = Number(cur.weather_code || 0);
                const rainMm = Number(cur.rain || 0) + Number(cur.precipitation || 0);
                const snowCm = Number(cur.snowfall || 0);
                const temp = Math.round(Number(cur.temperature_2m || 0));

                liveDetectedWeather = classifyWmoWeather(code, rainMm, snowCm);
                const desc = describeWmoWeather(code);

                if (weatherStatusTitle) weatherStatusTitle.textContent = `• ${desc} ${temp}°`;
                if (weatherStatusSub) {
                    weatherStatusSub.textContent = liveDetectedWeather === 'rain'
                        ? 'بارش باران تشخیص داده شد'
                        : (liveDetectedWeather === 'snow'
                            ? 'بارش برف تشخیص داده شد'
                            : 'هوا بدون بارش است');
                }
                applyEffectiveWeatherEffect();
                if (manualToast) {
                    showToast(`آب‌وهوا به‌روز شد: ${desc} (${temp}°)`);
                }
            } catch (_) {
                if (weatherStatusTitle) weatherStatusTitle.textContent = '• آفلاین';
                if (weatherStatusSub) weatherStatusSub.textContent = 'امکان انتخاب دستی باران یا برف';
                if (manualToast) showToast('اتصال اینترنت برای هواشناسی برقرار نشد');
            }
        }

        function syncLiveWeather(manualToast = false) {
            if (isNativeAndroid && typeof window.AndroidBridge.requestWeatherSync === 'function') {
                try { window.AndroidBridge.requestWeatherSync(); } catch (_) {}
            }

            if (weatherStatusSub) weatherStatusSub.textContent = 'در حال بررسی وضعیت آب‌وهوا...';

            if (!navigator.geolocation) {
                if (weatherStatusTitle) weatherStatusTitle.textContent = '• آماده';
                if (weatherStatusSub) weatherStatusSub.textContent = 'مکان‌یابی در دسترس نیست (انتخاب دستی)';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    fetchOpenMeteoWeather(pos.coords.latitude, pos.coords.longitude, manualToast);
                },
                () => {
                    if (weatherStatusTitle) weatherStatusTitle.textContent = '• بدون مکان';
                    if (weatherStatusSub) weatherStatusSub.textContent = 'دسترسی موقعیت بسته است (انتخاب دستی)';
                    if (manualToast) showToast('دسترسی به موقعیت برای هواشناسی فعال نیست');
                },
                { enableHighAccuracy: false, timeout: 7000, maximumAge: 600000 }
            );
        }

            const cardCenterX = cardRect.left + cardRect.width * 0.5;
            const cardCenterY = cardRect.top + cardRect.height * 0.5;
            return {

        let audioCtx = null;
        let synthInterval = null;
        let synthStep = 0;

        function startAmbientSynth(track) {
            stopAmbientSynth();
            if (isNativeAndroid && track.isNative) return;
            try {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const playChordNote = () => {
                    if (!isPlaying || track.audioUrl || track.isNative) return;
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const notes = track.notes || [261.63, 329.63, 392.00, 493.88];
                    const freq = notes[synthStep % notes.length];
                    synthStep++;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.18);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.35);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 1.4);
                };
                playChordNote();
                synthInterval = setInterval(playChordNote, 1100);
            } catch (_) {}
        }

        function stopAmbientSynth() {
            if (synthInterval) {
                clearInterval(synthInterval);
                synthInterval = null;
            }
        }
